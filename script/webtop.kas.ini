; ============================================================================
; kas.ini - kas 进程管理器配置
; 使用方式: kas -c /wsc/kway/kas.ini -s /wsc/kway/kas.sock
;
; 服务启动顺序:
;   dsk-ainit (一次性)
;     -> dsk-dbus
;     -> dsk-audio
;     -> dsk-xorg
;         -> dsk-desktop      (需要 xorg + dbus)
;         -> dsk-selkies      (需要 xorg)
;             -> dsk-gateway  (对外端口 7090)
; ============================================================================

[program:init]
command=/usr/srv/init.sh
type=once
priority=1
autostart=true
autorestart=false
; stdout_logfile=/tmp/init.log
; stderr_logfile=/tmp/init.err

[program:sshd]
command=/usr/sbin/sshd -D
type=long
priority=9
autostart=${KAS_SSHD}
autorestart=true
depends=init
; stdout_logfile=/tmp/sshd.log
; stderr_logfile=/tmp/sshd.err

[program:vscode]
command=/usr/srv/vscode.sh
type=long
priority=10
autostart=${KAS_VSCODE}
autorestart=true
; user=${USER}
; stdout_logfile=/tmp/vscode.log
; stderr_logfile=/tmp/vscode.err

[program:zcodex]
command=/usr/srv/zcodex.sh
type=long
priority=10
autostart=${KAS_ZCODEX}
autorestart=true
; user=${USER}
; stdout_logfile=/tmp/vscode.log
; stderr_logfile=/tmp/vscode.err

; -------- dsk-ainit: 一次性初始化 (首次运行) --------
[program:dsk-ainit]
command=/usr/srv/dsk-ainit.sh
autostart=${KAS_WEBTOP}
autorestart=false
type=once
priority=5
; stdout_logfile=/tmp/dsk/ainit.log
; stderr_logfile=/tmp/dsk/ainit.err

; -------- dsk-dbus: D-Bus 系统守护进程 --------
[program:dsk-dbus]
command=/usr/srv/dsk-dbus.sh
autostart=${KAS_WEBTOP}
autorestart=true
type=long
priority=10
depends=dsk-ainit
; stdout_logfile=/tmp/dsk/dbus.log
; stderr_logfile=/tmp/dsk/dbus.err

; -------- dsk-audio: PulseAudio 音频守护进程 --------
[program:dsk-audio]
command=/usr/srv/dsk-audio.sh
autostart=${KAS_WEBTOP}
autorestart=true
type=long
priority=10
depends=dsk-ainit
; stdout_logfile=/tmp/dsk/audio.log
; stderr_logfile=/tmp/dsk/audio.err

; -------- dsk-xorg: Xvfb 虚拟显示 --------
[program:dsk-xorg]
command=/usr/srv/dsk-xorg.sh
autostart=${KAS_WEBTOP}
autorestart=true
type=long
priority=10
depends=dsk-ainit
; stdout_logfile=/tmp/dsk/xorg.log
; stderr_logfile=/tmp/dsk/xorg.err

; -------- dsk-selkies: Selkies WebRTC 桥接 (端口 8082) --------
[program:dsk-selkies]
command=/usr/srv/dsk-selkies.sh
autostart=${KAS_WEBTOP}
autorestart=true
type=long
priority=20
depends=dsk-xorg,dsk-audio
stopwaitsecs=10
max_retries=5
restart_delay=3
; stdout_logfile=/tmp/dsk/selkies.log
; stderr_logfile=/tmp/dsk/selkies.err

; -------- dsk-desktop: XFCE 桌面环境 --------
[program:dsk-desktop]
command=/usr/srv/dsk-desktop.sh
autostart=${KAS_WEBTOP}
autorestart=true
type=long
priority=20
depends=dsk-xorg,dsk-dbus
stopwaitsecs=10
max_retries=5
restart_delay=3
; stdout_logfile=/tmp/dsk/desktop.log
; stderr_logfile=/tmp/dsk/desktop.err

; -------- dsk-gateway: Kvs 反向代理 (对外端口 7090, 无需密码) --------
[program:dsk-gateway]
command=/usr/srv/dsk-gateway.sh
autostart=${KAS_WEBTOP}
autorestart=true
type=long
priority=30
depends=dsk-selkies
stopwaitsecs=5
max_retries=10
restart_delay=2
; stdout_logfile=/tmp/dsk/gateway.log
; stderr_logfile=/tmp/dsk/gateway.err
