<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZCode 设备</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --card-bg: rgba(255,255,255,0.04);
    --card-shadow: 0 4px 6px -1px rgba(0,0,0,0.3), 0 20px 50px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.08);
    --text: #e4e4e7;
    --text-dim: #71717a;
    --accent: #6366f1;
    --accent-glow: rgba(99,102,241,0.3);
    --row-bg: rgba(255,255,255,0.04);
    --grid-opacity: 0.03;
    --orb-opacity: 0.15;
    --radius: 16px;
    --toggle-bg: rgba(255,255,255,0.06);
    --toggle-border: rgba(255,255,255,0.1);
    --transition: 0.12s cubic-bezier(0.4,0,0.2,1);
  }

  :root.light {
    --bg: #f4f4f8;
    --card-bg: rgba(255,255,255,0.7);
    --card-shadow: 0 4px 6px -1px rgba(0,0,0,0.06), 0 20px 50px -12px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.8);
    --border: rgba(0,0,0,0.08);
    --text: #18181b;
    --text-dim: #71717a;
    --accent: #4f46e5;
    --accent-glow: rgba(99,102,241,0.2);
    --row-bg: rgba(0,0,0,0.03);
    --grid-opacity: 0.06;
    --orb-opacity: 0.08;
    --toggle-bg: rgba(0,0,0,0.04);
    --toggle-border: rgba(0,0,0,0.1);
  }

  @media (prefers-color-scheme: light) {
    :root:not(.dark) {
      --bg: #f4f4f8;
      --card-bg: rgba(255,255,255,0.7);
      --card-shadow: 0 4px 6px -1px rgba(0,0,0,0.06), 0 20px 50px -12px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.8);
      --border: rgba(0,0,0,0.08);
      --text: #18181b;
      --text-dim: #71717a;
      --accent: #4f46e5;
      --accent-glow: rgba(99,102,241,0.2);
      --row-bg: rgba(0,0,0,0.03);
      --grid-opacity: 0.06;
      --orb-opacity: 0.08;
      --toggle-bg: rgba(0,0,0,0.04);
      --toggle-border: rgba(0,0,0,0.1);
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
    padding: 24px 24px 40px;
  }

  /* animated gradient orbs (same as login page) */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: var(--orb-opacity);
    pointer-events: none;
    animation: float 12s ease-in-out infinite;
  }
  .orb-1 { width: 500px; height: 500px; background: linear-gradient(135deg, #6366f1, #8b5cf6); top: -15%; left: -10%; }
  .orb-2 { width: 400px; height: 400px; background: linear-gradient(135deg, #06b6d4, #6366f1); bottom: -20%; right: -10%; animation-delay: -4s; }
  .orb-3 { width: 350px; height: 350px; background: linear-gradient(135deg, #a855f7, #ec4899); top: 50%; left: 50%; animation-delay: -8s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(30px, -40px) scale(1.05); }
    66%      { transform: translate(-20px, 20px) scale(0.95); }
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    margin: 0 auto;
  }

  .head {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 10px;
  }
  .icon-circle {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--accent-glow);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .title { font-size: 22px; font-weight: 600; text-align: center; letter-spacing: -0.3px; }
  .subtitle { font-size: 14px; color: var(--text-dim); text-align: center; margin-bottom: 24px; }

  .device-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }

  .device {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 8px;
    width: 240px;
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: var(--card-shadow);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 16px;
    transition: var(--transition);
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .device:hover {
    background: var(--accent-glow);
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .device-top { display: flex; align-items: center; justify-content: center; }
  .device-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; max-width: 100%; }
  .device-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .device-meta { color: var(--text-dim); font-size: 12px; font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.on  { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.7); }
  .dot.off { background: #71717a; }

  .device.off-device { cursor: default; }
  .device.off-device:hover { background: var(--card-bg); border-color: var(--border); transform: none; }
  .toolbar {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    display: flex;
    gap: 20px;
  }
  .logout-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--toggle-border);
    background: var(--toggle-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    line-height: 1;
    flex-shrink: 0;
  }
  .logout-btn:hover { background: var(--accent-glow); border-color: var(--accent); }

  /* custom tooltip — bigger than the tiny native one, appears fast */
  [data-tip] { position: relative; }
  [data-tip]::after {
    content: attr(data-tip);
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%) translateY(-2px);
    background: var(--toggle-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--toggle-border);
    color: var(--text);
    font-size: 13px;
    padding: 5px 10px;
    border-radius: 8px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease, transform 0.12s ease;
    z-index: 200;
  }
  [data-tip]:hover::after {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .empty {
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.8;
    padding: 24px 0 8px;
  }

  .hint {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    margin-top: 24px;
    opacity: 0.7;
  }

  /* theme toggle — flows inside .toolbar next to the logout button */
  .theme-toggle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--toggle-border);
    background: var(--toggle-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    line-height: 1;
  }
  .theme-toggle:hover {
    background: var(--accent-glow);
    border-color: var(--accent);
  }
</style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="toolbar">
    <button class="theme-toggle" id="themeToggle" data-tip="切换主题" aria-label="切换主题">💻</button>
  </div>

  <div class="wrap">
    <div class="head">
      <h1 class="title">ZCode 设备</h1>
      <button class="logout-btn" id="logoutBtn" type="button" data-tip="退出系统" aria-label="退出系统">⏻</button>
    </div>
    <p class="subtitle">已注册 {{TOTAL}} 台设备 · 在线 {{ONLINE}} 台</p>

    <div class="device-list">
      {{DEVICES}}
    </div>

    <div class="empty" style="display:{{EMPTY_DISPLAY}}">
      暂无已注册设备<br>
      启动 ZCode 桌面端并连接 relay 后，设备会出现在这里
    </div>

    <p class="hint">点击在线设备卡片即可打开远程控制页面</p>
  </div>

<script>
  // Theme toggle — identical behavior/key as the login page so the choice
  // carries over between pages.
  (function() {
    const html = document.documentElement, btn = document.getElementById('themeToggle'), K = 'proxy-theme';
    const STATES = ['system', 'light', 'dark'];
    const ICONS = { system: '💻', light: '☀️', dark: '🌙' };

    function getSystem() { return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }

    function getTheme() {
      const saved = localStorage.getItem(K);
      if (saved === 'light' || saved === 'dark') return saved;
      return 'system';
    }

    function applyTheme(t) {
      const effective = t === 'system' ? getSystem() : t;
      html.classList.remove('light', 'dark');
      if (effective === 'light') html.classList.add('light');
      else html.classList.add('dark');
      btn.textContent = ICONS[t] || ICONS.system;
      btn.title = ({ system: '跟随系统', light: '浅色模式', dark: '深色模式' })[t];
    }

    applyTheme(getTheme());

    btn.addEventListener('click', function() {
      var cur = getTheme(), idx = STATES.indexOf(cur), next = STATES[(idx + 1) % 3];
      localStorage.setItem(K, next === 'system' ? '' : next);
      applyTheme(next);
    });

    matchMedia('(prefers-color-scheme: light)').addEventListener('change', function() {
      if (getTheme() === 'system') applyTheme('system');
    });
  })();

  // Logout — /__logout clears the auth cookie and returns JSON rather than a
  // page, so reload afterwards (landing on the login page when auth is on).
  (function() {
    var btn = document.getElementById('logoutBtn');
    if (!btn) return;
    btn.addEventListener('click', function() {
      fetch('/__logout', { credentials: 'include' })
        .then(function() { location.reload(); })
        .catch(function() { location.reload(); });
    });
  })();
</script>
</body>
</html>
