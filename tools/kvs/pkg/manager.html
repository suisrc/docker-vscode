<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>应用中心</title>
<link rel="icon" href="/favicon.ico">
<style>
/* ============================================================================
   应用中心 — kvs manager
   PC: 顶栏 + 过滤 + 卡片网格        移动: 紧凑顶栏 + 列表行(可展开工作区)
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

:root {
  --bg: #0b0e14;
  --bg-blur: rgba(11, 14, 20, .78);
  --surface: #121722;
  --surface-2: #1a2130;
  --border: #232d40;
  --border-strong: #384760;
  --text: #e8ecf4;
  --text-2: #93a0b4;
  --text-3: #5d6b82;
  --zcd: #a48bff;
  --zcd-bg: rgba(148, 120, 255, .13);
  --zcd-bd: rgba(148, 120, 255, .38);
  --vsc: #4da3ff;
  --vsc-bg: rgba(64, 150, 255, .13);
  --vsc-bd: rgba(64, 150, 255, .38);
  --ok: #3ad29b;
  --ok-ring: rgba(58, 210, 155, .28);
  --off: #8b97ab;
  --unk: #7f9cc4;
  --danger: #ff7a85;
  --danger-bg: rgba(255, 122, 133, .12);
  --grad: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
  --radius: 14px;
  --shadow: 0 1px 2px rgba(0, 0, 0, .28), 0 14px 34px -18px rgba(0, 0, 0, .55);
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

:root.light {
  --bg: #f4f6fa;
  --bg-blur: rgba(244, 246, 250, .85);
  --surface: #ffffff;
  --surface-2: #eef1f6;
  --border: #e3e8f0;
  --border-strong: #c9d3e0;
  --text: #1a2333;
  --text-2: #566179;
  --text-3: #8a95a8;
  --zcd: #7a5af8;
  --zcd-bg: rgba(122, 90, 248, .09);
  --zcd-bd: rgba(122, 90, 248, .32);
  --vsc: #0078d4;
  --vsc-bg: rgba(0, 120, 212, .08);
  --vsc-bd: rgba(0, 120, 212, .30);
  --ok: #0c9d6e;
  --ok-ring: rgba(12, 157, 110, .18);
  --off: #98a3b5;
  --unk: #6d87ad;
  --danger: #e5484d;
  --danger-bg: rgba(229, 72, 77, .10);
  --shadow: 0 1px 2px rgba(23, 32, 64, .05), 0 14px 30px -20px rgba(23, 32, 64, .2);
}

@media (prefers-color-scheme: light) {
  :root:not(.dark):not(.light) {
    --bg: #f4f6fa; --bg-blur: rgba(244,246,250,.85); --surface: #ffffff; --surface-2: #eef1f6;
    --border: #e3e8f0; --border-strong: #c9d3e0; --text: #1a2333; --text-2: #566179; --text-3: #8a95a8;
    --zcd: #7a5af8; --zcd-bg: rgba(122,90,248,.09); --zcd-bd: rgba(122,90,248,.32);
    --vsc: #0078d4; --vsc-bg: rgba(0,120,212,.08); --vsc-bd: rgba(0,120,212,.30);
    --ok: #0c9d6e; --ok-ring: rgba(12,157,110,.18); --off: #98a3b5; --unk: #6d87ad;
    --danger: #e5484d; --danger-bg: rgba(229,72,77,.10);
    --shadow: 0 1px 2px rgba(23,32,64,.05), 0 14px 30px -20px rgba(23,32,64,.2);
  }
}

html { scrollbar-gutter: stable; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  transition: background .25s, color .25s;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(46rem 22rem at 50% -6rem, rgba(99, 102, 241, .10), transparent 62%);
}
:root.light body::before { background: radial-gradient(46rem 22rem at 50% -6rem, rgba(99, 102, 241, .06), transparent 62%); }

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

/* ----------------------------------------------------------------- 顶栏 --- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--bg-blur);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1160px; margin: 0 auto; padding: 14px 28px;
  display: flex; align-items: center; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 12px; flex: none;
  background: var(--grad); color: #fff;
  display: grid; place-items: center;
  box-shadow: 0 6px 18px -8px rgba(99, 102, 241, .55);
}
.brand-mark svg { width: 22px; height: 22px; }
.brand-txt { min-width: 0; }
.brand-txt h1 { font-size: 17px; font-weight: 650; letter-spacing: -.2px; line-height: 1.25; }
.brand-sub { display: flex; align-items: center; gap: 9px; margin-top: 1px; min-width: 0; }
#subTitle { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* ZCode 控制：点击复制远程控制中继地址（在“N 个在线”之后） */
.zctl {
  flex: none; display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--zcd); white-space: nowrap; padding: 0;
  transition: color .14s;
}
.zctl svg { width: 12px; height: 12px; }
.zctl:hover { color: var(--text); }

.actions { margin-left: auto; display: flex; align-items: center; gap: 9px; }
.act-btn {
  height: 38px; min-width: 38px; padding: 0 10px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  transition: color .15s, border-color .15s, background .15s;
}
.act-btn svg { width: 17px; height: 17px; }
.act-btn:hover { color: var(--text); border-color: var(--border-strong); }
.act-btn:active { transform: translateY(1px); }
.act-btn.primary {
  background: var(--grad); border-color: transparent; color: #fff;
  padding: 0 15px; font-size: 13.5px; font-weight: 550;
  box-shadow: 0 6px 16px -8px rgba(99, 102, 241, .6);
}
.act-btn.primary:hover { filter: brightness(1.08); color: #fff; }
.act-btn.spin svg { animation: rot .7s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

/* ----------------------------------------------------------------- 主体 --- */
.wrap { max-width: 1160px; margin: 0 auto; padding: 22px 28px 56px; }

.filters { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.fchips { display: flex; gap: 9px; min-width: 0; }
.fchip {
  padding: 7px 14px; border-radius: 999px; font-size: 13px; color: var(--text-2);
  border: 1px solid var(--border); background: var(--surface);
  transition: color .15s, border-color .15s, background .15s;
}
.fchip b { font-weight: 600; margin-left: 3px; color: var(--text-3); transition: color .15s; }
.fchip:hover { color: var(--text); border-color: var(--border-strong); }
.fchip.active { color: var(--text); background: var(--surface-2); border-color: var(--border-strong); }
.fchip.active b { color: var(--text); }

.sync-zone { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: none; }
.sync-time { font-size: 11.5px; color: var(--text-3); font-family: var(--mono); white-space: nowrap; }
.act-btn.refresh { height: 33px; min-width: 33px; padding: 0 12px; font-size: 12.5px; }
.act-btn.refresh svg { width: 15px; height: 15px; }

/* ------------------------------------------------------- PC · 卡片网格 --- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(305px, 1fr)); gap: 16px; }
.rows { display: none; }

.card {
  position: relative;
  display: flex; flex-direction: column; gap: 13px;
  padding: 19px 19px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  outline: none;
}
.card.openable { cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
@media (hover: hover) {
  .card.openable:hover { transform: translateY(-2px); }
  .card.i-zcd.openable:hover { border-color: var(--zcd-bd); }
  .card.i-vsc.openable:hover { border-color: var(--vsc-bd); }
  .card.i-linux.openable:hover { border-color: rgba(252, 198, 36, .45); }
  .card.i-other.openable:hover { border-color: var(--border-strong); }
}
.card.openable:focus-visible { border-color: var(--vsc-bd); box-shadow: 0 0 0 3px var(--vsc-bg), var(--shadow); }
.card.locked { opacity: .78; }
.card.locked .app-ico, .card.locked .app-name { opacity: .6; }

.card-head { display: flex; align-items: center; gap: 13px; }
.app-ico {
  width: 44px; height: 44px; border-radius: 12px; flex: none;
  display: grid; place-items: center;
}
.app-ico svg { width: 33px; height: 33px; }   /* VS Code 官方 ribbon / Tux */
.app-ico img { display: block; }              /* ZCode 品牌 tile（自带圆角与渐变） */
.app-ico.i-zcd img { width: 40px; height: 40px; }
.app-ico.i-vsc { background: var(--vsc-bg); }
.app-ico.i-linux { background: rgba(252, 198, 36, .13); }
.app-ico.i-linux svg { width: 34px; height: 34px; }
.app-ico.i-other { background: var(--surface-2); color: var(--text-2); }
.app-ico.i-other svg { width: 27px; height: 27px; }
/* Logo 可点击：打开该应用的备注编辑 */
.app-ico.note-btn { cursor: pointer; transition: transform .16s ease; }
.app-ico.note-btn:hover { transform: scale(1.09); }
.app-ico.note-btn:active { transform: scale(.94); }
.app-ico.note-btn:focus-visible { outline: 2px solid var(--zcd-bd); outline-offset: 2px; }

.head-mid { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.app-name { font-size: 15.5px; font-weight: 620; letter-spacing: -.15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag-row { display: flex; gap: 6px; align-items: center; }
.tag {
  font-family: var(--mono); font-size: 10px; font-weight: 650; letter-spacing: .09em;
  padding: 2.5px 6px; border-radius: 5px; border: 1px solid;
}
.tag.zcd { color: var(--zcd); border-color: var(--zcd-bd); background: var(--zcd-bg); }
.tag.vsc { color: var(--vsc); border-color: var(--vsc-bd); background: var(--vsc-bg); }
.tag.linux { color: #d9a80c; border-color: rgba(252, 198, 36, .45); background: rgba(252, 198, 36, .10); }
.tag.other { color: var(--text-2); border-color: var(--border-strong); background: var(--surface-2); }
.tag.mini { color: var(--text-3); border-color: var(--border); background: var(--surface-2); font-weight: 550; }
/* 在线状态：不可删除的自动标签（含小圆点），不单独占行 */
.tag.st { font-weight: 550; display: inline-flex; align-items: center; gap: 5px; }
.tag.st .dot { width: 6px; height: 6px; }
.tag.st.on  { color: var(--ok); border-color: rgba(58, 210, 155, .35); background: rgba(58, 210, 155, .10); }
.tag.st.off { color: var(--off); border-color: var(--border); background: var(--surface-2); }
.tag.st.unk { color: var(--unk); border-color: rgba(127, 156, 196, .35); background: rgba(127, 156, 196, .10); }
/* 用户自定义标记 */
.tag.ct { color: var(--text-2); border-color: var(--border-strong); background: var(--surface-2); }
/* 标记编辑入口（铅笔 chip） */
.tag.tedit {
  cursor: pointer; color: var(--text-3); border-style: dashed;
  transition: color .14s, border-color .14s;
}
.tag.tedit:hover { color: var(--text); border-color: var(--border-strong); }
.tag.tedit svg { width: 10px; height: 10px; }

.status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); flex: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.on  { background: var(--ok); animation: pulse 2.6s ease-out infinite; }
.dot.off { background: var(--off); }
.dot.unk { background: var(--unk); }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 var(--ok-ring); }
  70%  { box-shadow: 0 0 0 7px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}

.card-meta { display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; color: var(--text-2); }
.meta-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.meta-row svg { width: 14px; height: 14px; color: var(--text-3); flex: none; }
.meta-row .val { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta-row .val .mono { font-family: var(--mono); font-size: 12px; }

/* 头部右侧操作组：编辑 + 删除，常显、可点 */
.card-acts { margin-left: auto; flex: none; display: flex; gap: 6px; }
.card-act {
  width: 32px; height: 32px; border-radius: 9px;
  display: grid; place-items: center; color: var(--text-3);
  border: 1px solid transparent;
  transition: color .15s, border-color .15s, background .15s;
}
.card-act svg { width: 16px; height: 16px; }
.card-act.edit:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
.card-act.del:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }

/* 工作区（VS Code 专属）：卡片内小胶囊，点击直达对应工作区；
   悬停时上方浮出 [删除|编辑] 操作条 */
.folders { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 13px; border-top: 1px dashed var(--border); margin-top: auto; }
.fld {
  position: relative;
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  font-size: 12px; color: var(--text-2); text-decoration: none; cursor: pointer;
  padding: 5.5px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
  transition: color .14s, border-color .14s, background .14s;
}
.fld svg { width: 13px; height: 13px; flex: none; }
.fld .fld-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fld:hover { color: var(--vsc); border-color: var(--vsc-bd); background: var(--vsc-bg); }
.fld.add { border-style: dashed; color: var(--text-3); }
.fld.add:hover { color: var(--text-2); border-color: var(--border-strong); background: var(--surface-2); }

/* 悬停浮出的操作条：左删除、右编辑。
   鼠标移开后延迟 1s 才收起（期间保持可见可点），方便从胶囊移到按钮上；
   背景为半透明玻璃。 */
.fld-acts {
  position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%);
  display: flex; gap: 2px; padding: 3px; z-index: 12;
  background: rgba(16, 20, 29, .72);   /* 半透明 */
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border-strong); border-radius: 10px;
  box-shadow: 0 10px 26px -10px rgba(0, 0, 0, .5);
  opacity: 0; visibility: hidden;
  transition: opacity .18s ease 1s, visibility 0s linear 1s;   /* 收起延迟 1s */
}
:root.light .fld-acts { background: rgba(255, 255, 255, .75); }
@media (prefers-color-scheme: light) {
  :root:not(.dark):not(.light) .fld-acts { background: rgba(255, 255, 255, .75); }
}
.fld:hover .fld-acts, .fld:focus-within .fld-acts {
  opacity: 1; visibility: visible;
  transition: opacity .13s ease, visibility 0s;                /* 出现即时 */
}
.fa-btn {
  width: 27px; height: 27px; border-radius: 7px;
  display: grid; place-items: center; color: var(--text-2);
  transition: color .13s, background .13s;
  background: none;
}
.fa-btn svg { width: 14px; height: 14px; }
.fa-btn:hover { background: rgba(127, 140, 170, .22); color: var(--text); }
.fa-btn.del:hover { color: var(--danger); background: var(--danger-bg); }

/* ------------------------------------------------------- 移动 · 列表行 --- */
.rows { flex-direction: column; gap: 9px; }
.mrow {
  display: flex; align-items: center; gap: 13px;
  padding: 13px 15px; min-height: 64px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 13px;
  transition: background .14s;
}
.mrow.openable { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.mrow.openable:active { background: var(--surface-2); }
.mrow .app-ico { width: 40px; height: 40px; border-radius: 11px; }
.mrow .app-ico svg { width: 29px; height: 29px; }
.mrow .app-ico.i-zcd img { width: 36px; height: 36px; }
.mrow .app-ico.i-linux svg { width: 30px; height: 30px; }
.mrow .app-ico.i-other svg { width: 24px; height: 24px; }
.mrow-main { flex: 1; min-width: 0; }
.mrow-l1 { display: flex; align-items: center; gap: 7px; }
.mrow-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow-l2 { margin-top: 4px; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow-end { display: flex; align-items: center; gap: 4px; flex: none; color: var(--text-3); }
.mrow-end .status { margin: 0; }
.mrow-end svg { width: 17px; height: 17px; }
.chev-btn { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: var(--text-3); transition: transform .22s ease, color .14s; }
.chev-btn svg { width: 16px; height: 16px; }
.chev-btn.open { transform: rotate(90deg); color: var(--text-2); }

.mrow-fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .26s ease; }
.mrow-fold.open { grid-template-rows: 1fr; }
.mrow-fold > div { overflow: hidden; }
.mrow-fold .folders { margin: 0 6px 8px 68px; padding: 10px 0 2px; flex-direction: column; align-items: stretch; gap: 7px; }
.mrow-fold .fld { padding: 10px 12px; border-radius: 10px; font-size: 13px; justify-content: flex-start; background: var(--surface); }
.mrow-fold .fld.add { text-align: left; }
/* 触屏无悬停：工作区操作改为行内常显 */
.mrow-fold .fld-acts {
  position: static; transform: none; opacity: 1; visibility: visible;
  margin-left: auto; background: none; border: none; box-shadow: none; padding: 0;
  backdrop-filter: none; -webkit-backdrop-filter: none;
  transition: none;
}
.mrow-fold .fa-btn { width: 36px; height: 36px; }
.mrow-fold .fa-btn svg { width: 16px; height: 16px; }

/* ------------------------------------------------------------ 状态页 --- */
.empty, .err-banner {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 52px 20px; text-align: center; color: var(--text-2); font-size: 14px;
  border: 1px dashed var(--border); border-radius: var(--radius); background: var(--surface);
}
.empty svg { width: 40px; height: 40px; color: var(--text-3); opacity: .7; }
.empty .em-sub { font-size: 12.5px; color: var(--text-3); }
.err-banner { border-color: var(--danger); color: var(--danger); }
.btn {
  padding: 8px 18px; border-radius: 9px; font-size: 13.5px;
  border: 1px solid var(--border-strong); color: var(--text-2); background: var(--surface);
  transition: color .15s, border-color .15s;
}
.btn:hover { color: var(--text); }
.btn.primary { background: var(--grad); border-color: transparent; color: #fff; font-weight: 550; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn.danger { background: var(--danger); border-color: transparent; color: #fff; font-weight: 550; }
.btn.danger:hover { filter: brightness(1.06); color: #fff; }

/* Logo 选择器（其他类型） */
.logo-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.logo-opt {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 12px 4px 10px; border-radius: 11px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  font-size: 11.5px; transition: color .14s, border-color .14s, background .14s;
}
.logo-opt .app-ico { width: 38px; height: 38px; border-radius: 10px; }
.logo-opt .app-ico svg { width: 26px; height: 26px; }
.logo-opt .app-ico.i-zcd img { width: 34px; height: 34px; }
.logo-opt:hover { color: var(--text); border-color: var(--border-strong); }
.logo-opt.active { border-color: var(--vsc-bd); background: var(--vsc-bg); color: var(--text); }

.foot-hint { margin-top: 26px; text-align: center; font-size: 12px; color: var(--text-3); }
.only-m { display: none; }

/* --------------------------------------------------------------- 骨架 --- */
.skel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(305px, 1fr)); gap: 16px; }
.skel {
  height: 172px; border-radius: var(--radius); border: 1px solid var(--border);
  background: linear-gradient(100deg, var(--surface) 40%, var(--surface-2) 50%, var(--surface) 60%);
  background-size: 220% 100%;
  animation: shimmer 1.5s linear infinite;
}
@keyframes shimmer { to { background-position: -220% 0; } }

/* ------------------------------------------------------------ 拖拽排序 --- */
.dragging {
  position: fixed; z-index: 300; pointer-events: none;
  margin: 0; opacity: .92; transform: scale(1.03);
  box-shadow: 0 26px 60px -18px rgba(0, 0, 0, .6) !important;
  cursor: grabbing;
}
.drag-slot {
  border: 2px dashed var(--border-strong); border-radius: var(--radius);
  background: var(--surface-2); opacity: .55;
}
#rows .drag-slot { border-radius: 13px; }
body.drag-in-progress { user-select: none; -webkit-user-select: none; cursor: grabbing; }
body.drag-in-progress .card.openable, body.drag-in-progress .mrow.openable { cursor: grabbing; }

/* --------------------------------------------------------- 底部工具栏 --- */
.toolbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 22px;
  background: var(--bg-blur);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
}
.toolbar-label {
  flex: none; display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-3); user-select: none;
}
.toolbar-label svg { width: 13px; height: 13px; }
.toolbar-tools {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
  overflow-x: auto; scrollbar-width: none;
}
.toolbar-tools::-webkit-scrollbar { display: none; }
.tool-btn {
  flex: none; height: 32px; padding: 0 13px; border-radius: 9px;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; color: var(--text-2);
  border: 1px solid var(--border); background: var(--surface);
  transition: color .14s, border-color .14s, background .14s;
}
.tool-btn svg { width: 13px; height: 13px; }
.tool-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
.tool-btn.manage { border-style: dashed; color: var(--text-3); }
.tool-btn.manage:hover { color: var(--text-2); }
.toolbar-empty { font-size: 12px; color: var(--text-3); white-space: nowrap; }

/* 标记编辑弹窗的 chips */
.tag-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; min-height: 34px; align-items: center; }
.tag-none { font-size: 12.5px; color: var(--text-3); }
.tchip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 6px 4px 9px; border-radius: 6px;
  border: 1px solid var(--border-strong); background: var(--surface-2);
  font-size: 11.5px; color: var(--text-2);
}
.tchip button { width: 19px; height: 19px; border-radius: 5px; display: grid; place-items: center; color: var(--text-3); }
.tchip button svg { width: 10px; height: 10px; }
.tchip button:hover { color: var(--danger); background: var(--danger-bg); }

/* 工具管理弹窗内的列表 */
.tool-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; max-height: 236px; overflow: auto; }
.tool-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 8px 9px 13px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface-2);
}
.tool-row .tr-name { flex: none; font-size: 13px; font-weight: 570; }
.tool-row .tr-addr {
  flex: 1; min-width: 0; font-family: var(--mono); font-size: 11.5px; color: var(--text-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tool-row .fld-acts {
  position: static; transform: none; opacity: 1; visibility: visible;
  background: none; border: none; box-shadow: none; padding: 0;
  backdrop-filter: none; -webkit-backdrop-filter: none;
  transition: none;
}
.tool-none { padding: 14px 0 2px; text-align: center; font-size: 12.5px; color: var(--text-3); }
@media (min-width: 768px) { .wrap { padding-bottom: 92px; } }
@media (max-width: 767px) { .toolbar { display: none; } }

/* -------------------------------------------------------------- 弹窗 --- */
.modal-mask {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(5, 8, 14, .58);
  backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  display: grid; place-items: center; padding: 22px;
  animation: fadeIn .16s ease;
}
@keyframes fadeIn { from { opacity: 0; } }
.modal {
  width: 100%; max-width: 430px; max-height: calc(100dvh - 60px); overflow: auto;
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 18px; padding: 22px 22px 20px;
  box-shadow: 0 28px 70px -24px rgba(0, 0, 0, .6);
  animation: popIn .2s cubic-bezier(.2, .9, .3, 1.2);
}
.modal.small { max-width: 360px; }
#confirmModal { z-index: 120; }   /* 确认框永远盖在其他弹窗之上 */
@keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.modal h2 { font-size: 16.5px; font-weight: 640; letter-spacing: -.2px; }
.modal .modal-sub { margin-top: 4px; font-size: 12.5px; color: var(--text-2); }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; background: var(--surface-2); border-radius: 11px; margin-top: 16px; }
.seg button {
  padding: 8.5px; border-radius: 8px; font-size: 13px; color: var(--text-2);
  transition: color .14s, background .14s;
}
.seg button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 5px rgba(0, 0, 0, .22); }

.field { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
.field > span { font-size: 12.5px; color: var(--text-2); }
.field .opt { color: var(--text-3); font-size: 11.5px; }
.field input, .field textarea {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; font: inherit; font-size: 13.5px; color: var(--text);
  transition: border-color .15s;
}
.field textarea { resize: vertical; min-height: 64px; font-family: var(--mono); font-size: 12.5px; }
.field textarea.note { font-family: var(--font); font-size: 13.5px; min-height: 118px; }

/* 可拉伸弹窗：蒙层带 .xw，拖右下角把手左右调宽；
   初始 430（标记弹窗 360），范围 300 ~ min(720px, 视口-44px) */
.modal-mask.xw .modal {
  width: 430px; min-width: 300px;
  max-width: min(720px, calc(100vw - 44px));
  resize: horizontal;
}
#tagsModal .modal { width: 360px; }
/* 备注弹窗：宽高双向，输入区随弹窗伸缩 */
#noteModal .modal {
  display: flex; flex-direction: column;
  min-height: 250px; resize: both;
}
#noteModal .modal > h2,
#noteModal .modal > .modal-sub,
#noteModal .modal > .modal-acts { flex: none; }
#noteModal .field { flex: 1; }
#noteModal textarea.note { flex: 1; width: 100%; resize: none; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--vsc-bd); }
.field input::placeholder, .field textarea::placeholder { color: var(--text-3); }

.modal-acts { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

/* -------------------------------------------------------------- 提示 --- */
.toast {
  position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
  z-index: 200; padding: 10px 18px; border-radius: 11px;
  background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text);
  font-size: 13.5px; box-shadow: 0 14px 34px -12px rgba(0, 0, 0, .5);
  animation: toastIn .22s cubic-bezier(.2, .9, .3, 1.15);
}
.toast.err { border-color: var(--danger); color: var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } }

/* ------------------------------------------------------------ 移动端 --- */
@media (max-width: 767px) {
  .cards { display: none; }
  .rows { display: flex; }
  .topbar-inner { padding: 10px 16px; gap: 10px; }
  .brand-mark { width: 38px; height: 38px; border-radius: 11px; }
  .brand-txt h1 { font-size: 15.5px; }
  #subTitle { font-size: 11px; }
  .zctl { font-size: 11px; gap: 3px; }
  .act-btn { height: 36px; min-width: 36px; padding: 0 9px; }
  .act-btn.primary span { display: none; }
  .act-btn.primary { padding: 0; }
  .wrap { padding: 14px 14px 44px; }
  .filters { margin-bottom: 14px; }
  .fchips {
    overflow-x: auto; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .fchips::-webkit-scrollbar { display: none; }
  .fchip { flex: none; padding: 7px 13px; }
  .sync-time { display: none; }
  .sync-zone { gap: 0; }
  .only-pc { display: none; }
  .only-m { display: inline; }
  .act-btn.refresh span { display: none; }
  .act-btn.refresh { padding: 0 9px; }
  .modal-mask { place-items: end; padding: 0; align-items: end; }
  .modal {
    max-width: none; border-radius: 20px 20px 0 0; border-bottom: none;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    animation: sheetIn .26s cubic-bezier(.2, .9, .3, 1);
  }
  /* 触屏底部抽屉不拉伸，保持整宽 */
  .modal-mask.xw .modal { resize: none; width: 100%; min-width: 0; }
  @keyframes sheetIn { from { transform: translateY(40%); opacity: .4; } }
  .toast { bottom: calc(22px + env(safe-area-inset-bottom)); max-width: calc(100vw - 48px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark" id="brandMark"></div>
      <div class="brand-txt">
        <h1>应用中心</h1>
        <p class="brand-sub">
          <span id="subTitle">加载中…</span>
          <button class="zctl" id="btnZctl" type="button" title="复制 ZCode 远程控制中继地址"></button>
        </p>
      </div>
    </div>
    <div class="actions">
      <button class="act-btn primary" id="btnAdd" type="button" title="添加应用"></button>
      <button class="act-btn" id="themeToggle" type="button" title="切换主题"></button>
      <button class="act-btn" id="logoutBtn" type="button" title="退出登录"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="filters" id="filters" aria-label="类型过滤">
    <div class="fchips">
      <button class="fchip active" data-f="all" type="button">全部<b>0</b></button>
      <button class="fchip" data-f="zcd" type="button">ZCode<b>0</b></button>
      <button class="fchip" data-f="vsc" type="button">VS Code<b>0</b></button>
      <button class="fchip" data-f="other" type="button">其他<b>0</b></button>
    </div>
    <div class="sync-zone">
      <span id="lastUpdate" class="sync-time">加载中…</span>
      <button class="act-btn refresh" id="btnRefresh" type="button" title="立即刷新"></button>
    </div>
  </nav>

  <section id="cards" class="cards" aria-label="应用卡片"></section>
  <section id="rows" class="rows" aria-label="应用列表"></section>

  <div id="skelBox"></div>

  <div id="emptyState" class="empty" hidden>
    <div id="emptyIcon"></div>
    <div id="emptyText">暂无应用</div>
    <div class="em-sub" id="emptySub"></div>
  </div>

  <div id="errBanner" class="err-banner" hidden>
    <div>加载失败，请检查网络后重试</div>
    <button class="btn" id="btnRetry" type="button">重试</button>
  </div>

  <p class="foot-hint">
    <span class="only-pc">点击卡片打开应用 · 点击 Logo 写备注 · 拖拽卡片调整顺序 · 每 15 秒自动刷新</span>
    <span class="only-m">点击行打开应用 · 长按拖动调整顺序 · 每 15 秒自动刷新</span>
  </p>
</main>

<!-- 添加应用 -->
<div class="modal-mask xw" id="addModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="添加应用">
    <h2 id="addTitle">添加应用</h2>
    <p class="modal-sub" id="addSub">接入一台 VS Code 或其他任意设备（如 Linux 桌面）</p>
    <div class="seg" id="segType">
      <button type="button" data-t="vsc" class="active">VS Code</button>
      <button type="button" data-t="other">其他</button>
    </div>
    <label class="field" id="iconField" style="display:none"><span>Logo</span>
      <div class="logo-picker" id="logoPicker">
        <button type="button" class="logo-opt" data-i="vsc"><span class="app-ico i-vsc"></span>VS Code</button>
        <button type="button" class="logo-opt" data-i="zcd"><span class="app-ico i-zcd"></span>ZCode</button>
        <button type="button" class="logo-opt" data-i="linux"><span class="app-ico i-linux"></span>Linux</button>
        <button type="button" class="logo-opt active" data-i="other"><span class="app-ico i-other"></span>其他</button>
      </div>
    </label>
    <label class="field"><span>名称</span>
      <input id="inpName" placeholder="如 ws02" maxlength="40" autocomplete="off">
    </label>
    <label class="field"><span>访问地址</span>
      <input id="inpURL" placeholder="https://ws02-7080-wsc.example.com" autocomplete="off">
    </label>
    <label class="field" id="foldersField"><span>工作区快捷方式 <span class="opt">可选 · 每行一个「名称=工作区路径」，也可只填路径</span></span>
      <textarea id="inpFolders" rows="3" placeholder="proj1=/wsc/go/proj1
/wsc/api"></textarea>
    </label>
    <div class="modal-acts">
      <button class="btn" id="addCancel" type="button">取消</button>
      <button class="btn primary" id="addOk" type="button">添加</button>
    </div>
  </div>
</div>

<!-- 添加 / 编辑工作区 -->
<div class="modal-mask xw" id="folderModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="工作区">
    <h2 id="folderTitle">添加工作区</h2>
    <p class="modal-sub" id="folderSub">同一设备的不同文件夹，通过 ?folder 参数打开</p>
    <label class="field"><span>名称 <span class="opt">留空取路径末段</span></span>
      <input id="inpFldName" placeholder="如 proj1" maxlength="24" autocomplete="off">
    </label>
    <label class="field"><span>工作区路径 <span class="opt">该设备上的目录地址</span></span>
      <input id="inpFldPath" placeholder="/wsc/go/proj1" autocomplete="off">
    </label>
    <div class="modal-acts">
      <button class="btn" id="folderCancel" type="button">取消</button>
      <button class="btn primary" id="folderOk" type="button">添加</button>
    </div>
  </div>
</div>

<!-- 确认操作 -->
<div class="modal-mask" id="confirmModal" hidden>
  <div class="modal small" role="alertdialog" aria-modal="true" aria-label="确认操作">
    <h2 id="cfTitle">确认</h2>
    <p class="modal-sub" id="cfMsg"></p>
    <div class="modal-acts">
      <button class="btn" id="cfCancel" type="button">取消</button>
      <button class="btn danger" id="cfOk" type="button">删除</button>
    </div>
  </div>
</div>

<!-- 常用工具管理 -->
<div class="modal-mask xw" id="toolsModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="常用工具">
    <h2>常用工具</h2>
    <p class="modal-sub">配置工具下载地址，点击底部工具栏按钮将在新标签页打开（下载或页面展示由浏览器决定）</p>
    <div id="toolList" class="tool-list"></div>
    <div class="field"><span>名称</span>
      <input id="inpToolName" placeholder="如 kvs" maxlength="24" autocomplete="off">
    </div>
    <div class="field"><span>地址</span>
      <input id="inpToolAddr" placeholder="https://example.com/kvs.tar.gz" autocomplete="off">
    </div>
    <div class="modal-acts">
      <button class="btn" id="toolCancel" type="button">关闭</button>
      <button class="btn primary" id="toolOk" type="button">添加</button>
    </div>
  </div>
</div>

<!-- 标记编辑 -->
<div class="modal-mask xw" id="tagsModal" hidden>
  <div class="modal small" role="dialog" aria-modal="true" aria-label="编辑标记">
    <h2>编辑标记</h2>
    <p class="modal-sub" id="tagsSub"></p>
    <div id="tagChips" class="tag-chips"></div>
    <div class="field"><span>新增标记 <span class="opt">回车添加，最多 6 个</span></span>
      <input id="inpTag" placeholder="如 生产 / 测试" maxlength="12" autocomplete="off">
    </div>
    <div class="modal-acts">
      <button class="btn primary" id="tagsDone" type="button">完成</button>
    </div>
  </div>
</div>

<!-- 备注（点击卡片 Logo） -->
<div class="modal-mask xw" id="noteModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="编辑备注">
    <h2>备注</h2>
    <p class="modal-sub" id="noteSub"></p>
    <label class="field"><span>备注内容 <span class="opt">留空保存即删除 · Ctrl+Enter 快速保存</span></span>
      <textarea id="inpNote" class="note" rows="5" maxlength="500" placeholder="记录这台设备 / 应用的备注信息…"></textarea>
    </label>
    <div class="modal-acts">
      <button class="btn" id="noteCancel" type="button">取消</button>
      <button class="btn primary" id="noteOk" type="button">保存</button>
    </div>
  </div>
</div>

<!-- 底部工具栏（移动端隐藏） -->
<footer class="toolbar" id="toolbar">
  <span class="toolbar-label" id="toolbarLabel">工具</span>
  <div class="toolbar-tools" id="toolbarTools"></div>
  <button class="tool-btn manage" id="btnToolManage" type="button" title="配置常用工具"></button>
</footer>

<div id="toast" class="toast" hidden></div>

<noscript><div class="err-banner" style="margin-top:20px">需要启用 JavaScript 才能使用应用中心</div></noscript>

function el(tag, cls, text) {

  return n;
}
function icon(name, cls) {

/* ============================================================= 主题切换 */
(function () {
  var html = document.documentElement, btn = $('themeToggle'), K = 'proxy-theme';
  var STATES = ['system', 'light', 'dark'];
  var ICONS = { system: 'monitor', light: 'sun', dark: 'moon' };
  var TITLES = { system: '主题：跟随系统', light: '主题：浅色', dark: '主题：深色' };

  function getSystem() {
    return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  function getTheme() {
    var saved = localStorage.getItem(K);
    return saved === 'light' || saved === 'dark' ? saved : 'system';
  }
  function applyTheme(t) {
    var effective = t === 'system' ? getSystem() : t;
    html.classList.remove('light', 'dark');
    html.classList.add(effective);
    btn.innerHTML = I[ICONS[t]];
    btn.title = TITLES[t];
  }
  applyTheme(getTheme());
  btn.addEventListener('click', function () {
    var cur = getTheme(), next = STATES[(STATES.indexOf(cur) + 1) % 3];
    localStorage.setItem(K, next === 'system' ? '' : next);
    applyTheme(next);
  });
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', function () {
    if (getTheme() === 'system') applyTheme('system');
  });
})();

/* ZCode 控制地址：一键复制远程控制中继的 wss 地址（桌面端 env 配置值） */
function zctlURL() {
  return 'ZCODE_WEB_REMOTE_CONTROL_RELAY_WS_URL=wss://' + location.host + '/remote/ws';
}
function legacyCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { /* 老浏览器降级失败 */ }
  ta.remove();
  return ok;
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function () { return true; },
      function () { return legacyCopy(text); });
  }
  return Promise.resolve(legacyCopy(text));
}
$('btnZctl').addEventListener('click', function () {
  copyText(zctlURL()).then(function (ok) {
    toast(ok ? '已复制 ZCode 控制地址' : '复制失败，请手动记录：' + zctlURL(), !ok);
  });
});

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function fmtDate(ms) {
  var t = new Date(ms);
  return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
}
function fmtFull(ms) {
  var t = new Date(ms);
  return fmtDate(ms) + ' ' + pad(t.getHours()) + ':' + pad(t.getMinutes());
}
function fmtClock(ms) {
  var t = new Date(ms);
  return pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds());
}
function statusOf(a) {
  if (a.online === true) return { label: '在线', cls: 'on' };
  if (a.online === false) return { label: '离线', cls: 'off' };
  return { label: '检测中', cls: 'unk' };
}
/* Logo 键：vsc | zcd | linux | other */
function iconOf(a) {
  if (a.icon === 'vsc' || a.icon === 'zcd' || a.icon === 'linux' || a.icon === 'other') return a.icon;
  return a.type === 'zcd' ? 'zcd' : a.type === 'vsc' ? 'vsc' : 'other';
}
var TAGS = { zcd: ['ZCD', 'zcd'], vsc: ['VSC', 'vsc'], linux: ['LNX', 'linux'], other: ['APP', 'other'] };
/* 顺序固定（服务器返回的 order 序），仅做类型过滤 */
function visibleApps() {
  return state.apps.filter(function (a) {
    if (state.filter === 'all') return true;
    var k = iconOf(a);
    if (state.filter === 'other') return k === 'linux' || k === 'other';
    return k === state.filter;
  });
}

/* 打开应用：先同步 window.open（保证不被拦截），再上报访问时间。
   契约：服务端只给 path（如 /zcode、/remote/v4?...），origin（协议+主机）
   由浏览器在此处按当前页面补全 —— 与 location.origin 始终一致 */
function openApp(a, url) {
  if (suppressClick) return;   // 刚结束一次拖拽，吞掉误触
  var target = url || a.url;
  if (!target) return;
  window.open(target, '_blank', 'noopener');
  recordVisit(a.id);
}
function recordVisit(id) {
  try {
    navigator.sendBeacon('/__manager/visit',
      new Blob([JSON.stringify({ id: id })], { type: 'application/json' }));
  } catch (e) { /* 上报失败不影响使用 */ }
}

/* ------------------------------------------------------------ 卡片（PC） */
function metaRow(iconName, html) {
  var row = el('div', 'meta-row');
  row.appendChild(icon(iconName));
  var v = el('span', 'val');
  v.appendChild(html);
  row.appendChild(v);
  return row;
}
function textNode(s) { return document.createTextNode(s); }
function monoNode(s) { var n = el('span', 'mono'); n.textContent = s; return n; }

function buildCard(a) {
  var st = statusOf(a);
  var icoKey = iconOf(a);
  var card = el('article', 'card i-' + icoKey + (a.url ? ' openable' : ' locked'));
  if (a.url) {
    card.tabIndex = 0;
    card.setAttribute('role', 'link');
    card.setAttribute('aria-label', '打开 ' + a.name);
  }

  var head = el('div', 'card-head');
  head.appendChild(noteLogo(a, icoKey));

  var mid = el('div', 'head-mid');
  mid.appendChild(el('div', 'app-name', a.name || a.id));
  var tags = el('div', 'tag-row');
  var tagInfo = TAGS[icoKey];
  tags.appendChild(el('span', 'tag ' + icoKey, tagInfo[0]));
  if (a.local) tags.appendChild(el('span', 'tag mini', '本地'));
  /* 在线状态：不可删除的自动标签，不单独占行 */
  var stTag = el('span', 'tag st ' + st.cls);
  stTag.appendChild(el('span', 'dot ' + st.cls));
  stTag.appendChild(el('span', null, st.label));
  tags.appendChild(stTag);
  /* 用户自定义标记 */
  (a.tags || []).forEach(function (t) {
    tags.appendChild(el('span', 'tag ct', t));
  });
  /* 标记编辑入口 */
  var tEdit = el('button', 'tag tedit');
  tEdit.type = 'button';
  tEdit.title = '编辑标记';
  tEdit.innerHTML = I.pencil;
  tEdit.addEventListener('click', function (e) {
    e.stopPropagation();
    openTagsModal(a);
  });
  tags.appendChild(tEdit);
  mid.appendChild(tags);
  head.appendChild(mid);

  /* 头部右侧操作：编辑 + 删除（仅自定义应用） */
  if (a.custom) {
    var acts = el('div', 'card-acts');
    var editBtn = el('button', 'card-act edit');
    editBtn.type = 'button';
    editBtn.title = '编辑 ' + a.name;
    editBtn.innerHTML = I.pencil;
    editBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      openAddModal(a);
    });
    acts.appendChild(editBtn);
    var del = el('button', 'card-act del');
    del.type = 'button';
    del.title = '删除 ' + a.name;
    del.innerHTML = I.trash;
    del.addEventListener('click', function (e) {
      e.stopPropagation();
      deleteApp(a);
    });
    acts.appendChild(del);
    head.appendChild(acts);
  }
  card.appendChild(head);

  /* 版本 · 操作系统 */
  var verRow = el('span');
  if (a.version) verRow.appendChild(monoNode(a.version));
  if (a.version && a.os) verRow.appendChild(textNode(' · '));
  if (a.os) verRow.appendChild(textNode(a.os));
  if (!a.version && !a.os) verRow.appendChild(textNode('—'));
  card.appendChild(metaRow('tag', verRow));

  /* 最后访问 */
  var seenRow = el('span');
  if (a.last_seen) {
    seenRow.appendChild(textNode('最后访问 '));
    seenRow.appendChild(el('span', 'mono', fmtFull(a.last_seen)));
  } else {
    seenRow.appendChild(textNode('尚未访问'));
  }
  card.appendChild(metaRow('clock', seenRow));

  /* 创建时间 */
  if (a.created_at) {
    var crRow = el('span');
    crRow.appendChild(textNode('创建于 '));
    crRow.appendChild(el('span', 'mono', fmtFull(a.created_at)));
    card.appendChild(metaRow('cal', crRow));
  }

  /* 工作区（VS Code 专属） */
  if (a.type === 'vsc' && a.url) {
    var folders = el('div', 'folders');
    (a.folders || []).forEach(function (f) {
      folders.appendChild(buildFolderChip(a, f));
    });
    var add = el('button', 'fld add');
    add.type = 'button';
    add.title = '添加工作区';
    add.appendChild(icon('folder'));
    add.appendChild(el('span', 'fld-name', '工作区'));
    add.addEventListener('click', function (e) {
      e.stopPropagation();
      openFolderModal(a);
    });
    folders.appendChild(add);
    card.appendChild(folders);
  }

  if (a.url) {
    card.addEventListener('click', function () { openApp(a); });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openApp(a); }
    });
  }
  attachDrag(card, a.id);
  return card;
}

/* 工作区访问地址：与卡片同 host，通过 ?folder= 打开指定工作区 */
function folderHref(a, f) {
  var base = String(a.url || '').replace(/\/+$/, '');
  return base + '/?folder=' + encodeURIComponent(f.path);
}

/* 工作区胶囊：点击打开；悬停上方浮出 [删除|编辑] */
function buildFolderChip(a, f) {

  delBtn.title = '删除工作区 ' + f.name;
  delBtn.innerHTML = I.trash;
  delBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    deleteFolder(a, f);
  });
  var editBtn = el('button', 'fa-btn');
  editBtn.type = 'button';
  editBtn.title = '编辑工作区 ' + f.name;
  editBtn.innerHTML = I.pencil;
  editBtn.addEventListener('click', function (e) {

function buildRow(a) {

  }
  attachDrag(row, a.id);
  frag.appendChild(row);

  /* 可展开的工作区列表 */
  if (hasFolders) {
    var fold = el('div', 'mrow-fold' + (state.expanded[a.id] ? ' open' : ''));

}

/* --------------------------------------------- 拖拽排序（PC 卡片 / 移动行） */
var dragCtx = null;         // 进行中的拖拽
var suppressClick = false;  // 拖拽结束后吞掉一次 click，避免误开应用

function attachDrag(item, id) {
  item.dataset.id = id;
  item.addEventListener('pointerdown', dragDown);
}

function dragDown(e) {
  if (dragCtx || state.filter !== 'all') return;   // 过滤视图下禁用拖拽
  if (e.button !== undefined && e.button !== 0) return;
  if (e.target.closest('button, a, input, textarea, .fld, .fld-acts')) return;
  var item = e.currentTarget;
  dragCtx = {
    id: item.dataset.id, el: item, container: item.parentNode,
    startX: e.clientX, startY: e.clientY, pointerId: e.pointerId,
    isTouch: e.pointerType === 'touch',
    active: false, timer: null, slot: null, offX: 0, offY: 0
  };
  if (dragCtx.isTouch) {
    dragCtx.timer = setTimeout(function () { beginDrag(); }, 240);  // 长按进入拖拽
  }
  /* 鼠标：移动超过阈值后进入（pointermove 中处理） */
}

function beginDrag() {
  var ctx = dragCtx;
  if (!ctx) return;
  ctx.active = true;
  var r = ctx.el.getBoundingClientRect();
  ctx.offX = ctx.startX - r.left;
  ctx.offY = ctx.startY - r.top;
  ctx.slot = el('div', 'drag-slot');
  ctx.slot.style.width = r.width + 'px';
  ctx.slot.style.height = r.height + 'px';
  ctx.container.insertBefore(ctx.slot, ctx.el);
  ctx.el.classList.add('dragging');
  ctx.el.style.left = r.left + 'px';
  ctx.el.style.top = r.top + 'px';
  ctx.el.style.width = r.width + 'px';
  document.body.appendChild(ctx.el);
  document.body.classList.add('drag-in-progress');
  document.addEventListener('touchmove', preventTouchScroll, { passive: false });
  /* 拖拽期间收起展开的工作区，落位后由 render 恢复 */
  document.querySelectorAll('.mrow-fold.open').forEach(function (f) { f.classList.remove('open'); });
}

function preventTouchScroll(e) {
  if (dragCtx && dragCtx.active) e.preventDefault();
}

document.addEventListener('pointermove', function (e) {
  var ctx = dragCtx;
  if (!ctx || e.pointerId !== ctx.pointerId) return;
  if (!ctx.active) {
    var dx = e.clientX - ctx.startX, dy = e.clientY - ctx.startY;
    if (ctx.isTouch) {
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) cancelDrag();  // 长按前移动 = 滚动
      return;
    }
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    beginDrag();
  }
  e.preventDefault();
  ctx.el.style.left = (e.clientX - ctx.offX) + 'px';
  ctx.el.style.top = (e.clientY - ctx.offY) + 'px';
  dragReorder(e.clientX, e.clientY);
});

/* 命中测试：指针下的其他卡片/行，占位槽插到其前/后 */
function dragReorder(x, y) {
  var ctx = dragCtx;
  var stack = document.elementsFromPoint(x, y) || [];
  var target = null;
  for (var i = 0; i < stack.length; i++) {
    var t = stack[i];
    if (t === ctx.el || ctx.el.contains(t)) continue;
    if (t.classList && (t.classList.contains('card') || t.classList.contains('mrow'))) { target = t; break; }
  }
  if (!target || !ctx.container.contains(target)) return;
  var r = target.getBoundingClientRect();
  var before = target.classList.contains('mrow')
    ? y < r.top + r.height / 2                    // 纵向列表
    : x < r.left + r.width / 2;                   // 卡片网格
  if (before) ctx.container.insertBefore(ctx.slot, target);
  else ctx.container.insertBefore(ctx.slot, target.nextSibling);
}

document.addEventListener('pointerup', function (e) {
  var ctx = dragCtx;
  if (!ctx || e.pointerId !== ctx.pointerId) return;
  if (!ctx.active) { cancelDrag(); return; }      // 未进入拖拽 = 普通点击
  finishDrag();
});
document.addEventListener('pointercancel', function (e) {
  if (dragCtx && e.pointerId === dragCtx.pointerId) cancelDrag();
});

function dropGhost() {
  var ctx = dragCtx;
  ctx.el.classList.remove('dragging');
  ctx.el.style.left = ctx.el.style.top = ctx.el.style.width = '';
  ctx.container.insertBefore(ctx.el, ctx.slot);
  ctx.slot.remove();
  document.body.classList.remove('drag-in-progress');
  document.removeEventListener('touchmove', preventTouchScroll);
  suppressClick = true;
  setTimeout(function () { suppressClick = false; }, 80);
}

function finishDrag() {
  var ctx = dragCtx;
  dropGhost();
  dragCtx = null;
  var ids = [];
  ctx.container.querySelectorAll('[data-id]').forEach(function (n) { ids.push(n.dataset.id); });
  saveOrder(ids);
}

function cancelDrag() {
  var ctx = dragCtx;
  if (!ctx) return;
  if (ctx.timer) clearTimeout(ctx.timer);
  dragCtx = null;
  if (!ctx.active) return;
  dropGhost();
  render();   // 恢复原状（含移动端展开状态）
}

function saveOrder(ids) {
  /* 本地立即按新顺序渲染，再持久化到 zcodex.json */
  var byId = {};
  state.apps.forEach(function (a) { byId[a.id] = a; });
  var ordered = [];
  ids.forEach(function (id) {
    if (byId[id]) { ordered.push(byId[id]); delete byId[id]; }
  });
  Object.keys(byId).forEach(function (id) { ordered.push(byId[id]); });  // 隐藏条目排后
  state.apps = ordered;
  render();
  fetch('/__manager/order', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids: ids })
  }).catch(function () { toast('顺序保存失败，将在下次加载后恢复', true); });
}

function loadApps(manual) {
  var btn = $('btnRefresh');

    .then(function (res) {
      var ct = res.headers.get('content-type') || '';
      if (ct.indexOf('json') < 0) { location.reload(); throw new Error('login'); }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (data) {

      state.tools = data.tools || [];
      state.loaded = true;
      hideError();
      render();
      $('lastUpdate').textContent = '更新于 ' + fmtClock(Date.now());

          loadApps(false);

    })
    .catch(function (err) {
      if (err && err.message === 'login') return;
      showError();
      render();
    })
    .then(function () { btn.classList.remove('spin'); });
}

/* 每行「名称=工作区路径」；只填路径时名称取末段 */
function parseFolders(text) {
  var out = [];
  String(text || '').split('\n').forEach(function (line) {
    line = line.trim();
    if (!line) return;
    var eq = line.indexOf('=');
    var name = '', path = '';
    if (eq >= 0) {
      name = line.slice(0, eq).trim();
      path = line.slice(eq + 1).trim();
    } else {
      path = line;
    }
    if (!path) return;
    if (!name) {
      var i = path.lastIndexOf('/');
      name = i >= 0 && i < path.length - 1 ? path.slice(i + 1) : path;
    }
    out.push({ name: name, path: path });
  });
  return out;
}

});

function renderTagChips() {
  var box = $('tagChips');

  ico.setAttribute('aria-label', '编辑「' + (a.name || a.id) + '」的备注');
  ico.tabIndex = 0;
  ico.addEventListener('click', function (e) {
    e.stopPropagation();
    if (suppressClick) return;   // 刚结束一次拖拽，吞掉误触
    openNoteModal(a);
  });
  ico.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openNoteModal(a); }
  });
  return ico;
}

function openNoteModal(a) {
  noteApp = a;
  var seq = ++noteSeq;
  $('noteSub').textContent = '关于「' + (a.name || a.id) + '」的备注信息';
  $('inpNote').value = '';
  openModal('noteModal');
  setTimeout(function () { $('inpNote').focus(); }, 60);
  /* 备注单独接口读取，不随列表返回 */
  fetch('/__manager/note?id=' + encodeURIComponent(a.id), { credentials: 'include' })
    .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(function (d) {
      if (seq !== noteSeq) return;   // 弹窗已切换
      $('inpNote').value = d.note || '';
    })
    .catch(function () { toast('备注加载失败', true); });
}
$('noteCancel').addEventListener('click', function () { closeModal('noteModal'); });
$('inpNote').addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); $('noteOk').click(); }
});
$('noteOk').addEventListener('click', function () {
  if (!noteApp) return;
  var text = $('inpNote').value.trim();
  fetch('/__manager/note', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: noteApp.id, note: text })
  }).then(function (res) {
    if (!res.ok) return res.text().then(function (t) { throw new Error(t || ('HTTP ' + res.status)); });
    closeModal('noteModal');
    toast(text ? '已保存备注' : '已清除备注');
  }).catch(function (err) { toast('保存失败：' + err.message, true); });
});

/* ------------------------------------------------------- 底部工具栏 ---- */
function renderToolbar() {
  var box = $('toolbarTools');
  box.textContent = '';
  if (!(state.tools || []).length) {
    box.appendChild(el('span', 'toolbar-empty', '点击 + 配置常用工具下载地址'));
  } else {
    state.tools.forEach(function (t) {
      var btn = el('button', 'tool-btn');
      btn.type = 'button';
      btn.title = t.addr;
      btn.appendChild(icon('tag'));
      btn.appendChild(el('span', null, t.name));
      btn.addEventListener('click', function () {
        window.open(t.addr, '_blank', 'noopener');
      });
      box.appendChild(btn);
    });
  }
}

var toolOld = null;   // 编辑模式：原名称
function renderToolList() {
  var list = $('toolList');
  list.textContent = '';
  if (!(state.tools || []).length) {
    list.appendChild(el('div', 'tool-none', '暂未配置工具，在下方添加'));
    return;
  }
  state.tools.forEach(function (t) {
    var row = el('div', 'tool-row');
    row.appendChild(el('span', 'tr-name', t.name));
    row.appendChild(el('span', 'tr-addr', t.addr));
    var acts = el('span', 'fld-acts');
    var delBtn = el('button', 'fa-btn del');
    delBtn.type = 'button';
    delBtn.title = '删除 ' + t.name;
    delBtn.innerHTML = I.trash;
    delBtn.addEventListener('click', function () {
      confirmBox({ title: '删除工具', msg: '确定删除「' + t.name + '」？' }).then(function (ok) {
        if (!ok) return;
        fetch('/__manager/tool?name=' + encodeURIComponent(t.name), { method: 'DELETE', credentials: 'include' })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            toast('已删除「' + t.name + '」');
            loadApps(false).then(renderToolList);
          })
          .catch(function () { toast('删除失败', true); });
      });
    });
    var editBtn = el('button', 'fa-btn');
    editBtn.type = 'button';
    editBtn.title = '编辑 ' + t.name;
    editBtn.innerHTML = I.pencil;
    editBtn.addEventListener('click', function () {
      toolOld = t.name;
      $('inpToolName').value = t.name;
      $('inpToolAddr').value = t.addr;
      $('toolOk').textContent = '保存';
    });
    acts.appendChild(delBtn);
    acts.appendChild(editBtn);
    row.appendChild(acts);
    list.appendChild(row);
  });
}
function openToolsModal() {
  toolOld = null;
  $('inpToolName').value = '';
  $('inpToolAddr').value = '';
  $('toolOk').textContent = '添加';
  renderToolList();
  openModal('toolsModal');
  setTimeout(function () { $('inpToolName').focus(); }, 60);
}
$('btnToolManage').addEventListener('click', openToolsModal);
$('toolCancel').addEventListener('click', function () { closeModal('toolsModal'); });
$('toolOk').addEventListener('click', function () {
  var name = $('inpToolName').value.trim();
  var addr = $('inpToolAddr').value.trim();
  if (!name) { toast('请填写名称', true); return; }
  if (!addr) { toast('请填写地址', true); return; }
  var body = { name: name, addr: addr };
  if (toolOld) body.old = toolOld;
  fetch('/__manager/tool', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (res) {
    if (!res.ok) return res.text().then(function (t) { throw new Error(t || ('HTTP ' + res.status)); });
    toast(toolOld ? '已保存「' + name + '」' : '已添加「' + name + '」');
    toolOld = null;
    $('inpToolName').value = '';
    $('inpToolAddr').value = '';
    $('toolOk').textContent = '添加';
    loadApps(false).then(renderToolList);
  }).catch(function (err) { toast('保存失败：' + err.message, true); });
});

/* ---- 删除 ---- */
function deleteApp(a) {
  confirmBox({ title: '删除应用', msg: '确定删除「' + a.name + '」？该操作不可恢复。' })
    .then(function (ok) {
      if (!ok) return;
      fetch('/__manager?id=' + encodeURIComponent(a.id), { method: 'DELETE', credentials: 'include' })
        .then(function (res) {
          if (!res.ok) return res.text().then(function (t) { throw new Error(t || ('HTTP ' + res.status)); });
          toast('已删除「' + a.name + '」');
          loadApps(false);
        })
        .catch(function (err) { toast('删除失败：' + err.message, true); });
    });
}
function deleteFolder(a, f) {
  confirmBox({ title: '删除工作区', msg: '确定删除「' + a.name + '」的工作区「' + f.name + '」？' })
    .then(function (ok) {
      if (!ok) return;
      fetch('/__manager/folder?id=' + encodeURIComponent(a.id) + '&name=' + encodeURIComponent(f.name),
        { method: 'DELETE', credentials: 'include' })
        .then(function (res) {
          if (!res.ok) return res.text().then(function (t) { throw new Error(t || ('HTTP ' + res.status)); });
          toast('已删除工作区「' + f.name + '」');
          loadApps(false);
        })
        .catch(function (err) { toast('删除失败：' + err.message, true); });
    });
}

/* ---- 轻提示 ---- */
var toastTimer = null;
function toast(msg, isErr) {
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr ? ' err' : '');
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
}

/* ================================================================ 启动 */
document.querySelectorAll('#logoPicker .logo-opt').forEach(function (b) {
  b.querySelector('.app-ico').innerHTML = I[b.dataset.i];
});
showSkeletons();
loadApps(false);
setInterval(function () {
  if (!document.hidden) loadApps(false);
}, POLL_MS);
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) loadApps(false);
});
})();
</script>
</body>
</html>
