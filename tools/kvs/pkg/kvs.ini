# ============================================================================
# kvs.ini — kvs 反向代理网关配置文件
#
# 使用方式:
#   kvs demo [default|vscode|zcodex]
#   kvs -c kvs.ini             # 指定配置文件 (可选, 缺省使用内嵌 kvs.ini)
#   kvs -n :zcodex             # 使用 proxies.zcodex 作为默认路由
#   kvs -n :vscode             # 使用 proxies.vscode 作为默认路由
#   kvs -n "/__healthz=text://OK:@now;/=http://127.0.0.1:8080"
#
# 当路由中需要 svc://<name> 这种配置的时候，才会触发解析 service.<name> 部分内容
#
# 所有值都支持 ${VAR} 或 $VAR 环境变量展开。
# ============================================================================

# ----------------------------------------------------------------------------
# 基础配置
# ----------------------------------------------------------------------------

# 工作目录基准, 如果 KVS_HOME 不存在， 会反向赋值 KVS_HOME
home = {KVS_HOME:-/app/.kvs}

# 监听端口 (SSL 时 HTTPS = port+1), 如果 KVS_PORT 不存在，会反向赋值 KVS_PORT
port = {KVS_PORT:-7000}

# ----------------------------------------------------------------------------

# 启用自签名 HTTPS
use_ssl = {KVS_USE_SSL:-false}

# 启用 401/403→登录页重定向 + 退出按钮注入
login_authz = {KVS_LOGIN_AUTHZ:-false}

# 静态 Cookie 校验值 (留空则不校验，依赖后端 401 鉴权)
# 设置后 Cookie 值必须等于此值，否则返回登录页
login_token = {KVS_LOGIN_TOKEN}

# 默认为空(跟0一致)，将 token 原样放入 cookie 中，session 同生命周期, 小于 0 启动报错， 错误的参数
# 大于0， 生成16位0~f随机字符串， time.rand.(sha256(time.rand.token)[:24]) 作为 value 放入 cookie 中。
# 作为网关需要校验的内容， 1: sha256(time.rand.token)[:24]是否一致， 2: 时间是否过期（还剩1/4时间，自动更新cookie令牌）
login_timeout = {KVS_LOGIN_TIMEOUT:-0}

# Cookie 名
cookie_token_key = {KVS_COOKIE_TOKEN_KEY:-kvs}

# 通过 query 上的 token 完成访问， 默认关闭， key为空则不启用
query_token_key = {KVS_QUERY_TOKEN_KEY}

# 不需要鉴权的接口， 格式： /api/v1/public|/api/v2/public|...
path_public = {KVS_PATH_PUBLIC}

# ----------------------------------------------------------------------------
# 反向代理调优（可省略，全部有默认值）
# ----------------------------------------------------------------------------
# WebSocket 升级处理：auto=自研快路径（裸连接隧道：内核 splice、补齐握手期已缓冲
# 的客户端字节、可选空闲超时），握手失败自动回退 stdlib；stdlib=始终旧行为。
ws_proxy = {KVS_WS_PROXY:-auto}

# WS 隧道空闲超时（秒）：0=关闭（默认）。>0 时，两个方向都静默约 2 倍该值才断开；
# 某一方向有数据但对端在 max(该值,30s) 内一个字节都不读（客户端挂起）时也会断开：
# 写超时会丢掉 splice 管道里已读出的字节，所以这种情况必须断开而不是继续拷贝。
# 启用后该连接的拷贝走分块路径（实测仍命中 splice，吞吐与默认模式无差异）。
ws_idle_timeout = {KVS_WS_IDLE:-0}

# 每个后端的空闲连接上限（默认 32；Go 默认只有 2，VS Code Web 首屏并发高时
# 会反复重建连接）。proxy_max_idle_conns 是全局上限（默认 256）。
proxy_idle_conns_per_host = {KVS_PROXY_IDLE_CONNS:-32}
proxy_max_idle_conns = {KVS_PROXY_MAX_IDLE:-256}

# 代理不做透明 gzip（默认 true，推荐）：原样透传客户端的 Accept-Encoding，
# 避免"代理解压再压缩"的浪费与 Content-Encoding 语义改写。
proxy_disable_compression = {KVS_PROXY_DISABLE_GZIP:-true}

# 流式响应刷出间隔（毫秒）：默认 100，0=不主动刷（Go 默认），-1=每次写都刷。
proxy_flush_interval = {KVS_PROXY_FLUSH_MS:-100}

# 主 server 读完整请求（含 body）的秒数：默认 60，0=不限（大上传/慢客户端）。
# WebSocket 不受影响（升级 hijack 后即清空 deadline）。
read_timeout = {KVS_READ_TIMEOUT:-60}

# 可选 pprof（仅用于排障，默认关闭）：KVS_PPROF=1 或 =<port>，只监听 127.0.0.1。

# ----------------------------------------------------------------------------
# 缓存配置
# ----------------------------------------------------------------------------

# 针对于 cc~ 的静态资源内容修改, 格式 old|new|file[,files…][|host[,hosts…]]
# 规则唯一来源：一个变量一条规则（KVS_CC_SED_<名称>=…），名称就是分组标签，
# 变量名排序后生效；没有 ini 配置项，也没有整包的多规则变量。
# 文件名列表用 , 分隔，可写多个：任一命中即套用该组。
#   - __index  无扩展名的请求统一存为 __index：目录首页（/、/0.42.0/，含尾斜杠）
#              与 …/0.42.0/extension 这类无后缀端点都是它，规则只需匹配 __index。
#   - *.js /*.json 等  只支持一个 * 通配（前缀/后缀匹配）；无 * 时按全名精确匹配。
#   只有文件名列表与 host 列表按 , 切分，原始/替换内容原样保留（含逗号，也含 | 以外的字符）
# host 列表可选：留空=任意；命中判定比对**代理后端的主机**（内容来源，如 vscode.dev /
#   main.vscode-cdn.net / zcode.z.ai），与访问域名无关 —— 隧道域名、生产域名变了照样生效。
#   带端口的目标（host:port）与裸域名等价、大小写不敏感、同样支持一个 * 通配（*.a.com）。
#   注意 host 过滤是“写入缓存时”的判定：计划随条目落盘，之后命中按记录的计划重放。
# 替换内容含 >host< 时按请求 Host 动态展开。处理模式写入缓存元数据 (sed)：
#   once = 与请求无关的替换，写入时替换一次并存储结果 (原文备份为 <file>_.bak1)
#   each = 含 >host< 的替换，once 先替换保存，原始内容 (gzip 解包为明文) 存储，
#          实际生效的 each 规则以数组持久化 (sed.each)；每次命中时按当前 Host
#          重替换后返回；响应是否 gzip 跟随原始响应 (src_gzip)

# 下载缓存目录 (非空且非空目录则跳过下载)
# 缓存1：{CACHE_DIR}/version/{KVS_SVC_<NAME>}/{VERSION}_{VERHASH}.{EXT}
# 缓存2：{CACHE_DIR}/ccproxy/{domain}/{path}[.{version}].xxx
cache_dir = {KVS_HOME}/cache

# /__cache/ 外部资源代理缓存路径前缀；留空禁用缓存代理 (默认空)
# 环境变量 KVS_CACHE_PATH
# 缓存键 {scheme}:{host} 与全路径统一小写（域名/路径大小写差异不会拆条目或未命中）；
# 只折叠磁盘键，回源请求仍按原大小写发出。
cache_path = {KVS_CACHE_PATH}

# [cache_headers] 段：附加到缓存响应的头（只在 cache_path 前缀下的请求上生效）。
# Xxx=Val 设置/覆盖（空值忽略）；用于跨域加载静态资源，例如：
#   Access-Control-Allow-Origin  = *          # 允许任意源
#   Cross-Origin-Resource-Policy = cross-origin
#   Access-Control-Allow-Methods = GET, HEAD, OPTIONS   # OPTIONS 预检应答（204）也带上
[cache_headers]
Access-Control-Allow-Origin = *
Cross-Origin-Resource-Policy = cross-origin
Access-Control-Allow-Methods = GET, HEAD, OPTIONS

# ----------------------------------------------------------------------------
# 请求头改写 ([headers] 段)
#   请求头改写。Xxx=Val 设置/覆盖；Xxx= 删除。
#   值支持 ${VAR} 环境变量展开。
# ----------------------------------------------------------------------------
[headers]
x-forwarded-port = {KVS_SVC_HEADER_X_FORWARDED_PORT:-443}

# ----------------------------------------------------------------------------
# 后端路由 ([proxies] 段，必填)
# ----------------------------------------------------------------------------

# 每行一个路由: prefix = url，按文件顺序匹配。
# prefix 以 ^ 开头标记为正则表达式匹配。
#
# 托管服务后端使用 svc://<name> 目标，无隐式提升。
#
# 单后端示例:
#   /=http://localhost:8080
#   /=unix:///var/run/app.sock
#   /=file:///var/www/html
#   /=text://Hello World
#   /<path>=api://<name> 内部服务，可挂任意 path（如 /manager=api://manager）
#   /=svc://<service.name> kvs 托管服务
#
# 多后端示例:
#   ws~/=ws://localhost:8080 #特殊
#     ws~ 标记：该路由按前缀匹配（http/https/ws/wss/unix 目标），升级请求走 WS 快路径，
#     非升级请求照常反代；进程内端点（relay://、api://）仍要求路径完全相等。
#   cc~/=https://api:8080  自动缓存
#   /api/=http://api:8080  前缀匹配
#   -/+=http://api:8080  "-" 替换（去掉路由前缀拼到目标路径）、"+" 追加（完整请求路径拼到目标路径），
#     http(s)/ws(s)/unix/svc/file 支持（file 默认去前缀，"+" 表示保留挂载前缀）；
#     text/relay/api 不支持（路径对它们无意义），写了会告警并忽略
#   /cdn/=file:///var/www  静态文件
#   ^xxx=http://localhost:8080  正则表达式匹配
#   /stable-<verhash>/=svc://vscode  前缀含 <verhash>/<version> 占位符时，按目标service 的 VersionHash/Version
#     在请求时动态展开后做前缀匹配（仅前缀匹配，不支持正则；服务未启动/版本未解析时该路由跳过）。占位符仅对 svc:// 有效
#   /stable-<verhash>/web-extension-resource/=svc://vscode.ext  svc 服务扩展：svc://<name>.<ext> 分发到服务自带的扩展 
#     handler（RegisterSvcExt 注册，按请求收到服务配置），不走反代也不走 api 静态服务
#   /=svc://xxx  kvs 托管服务, 由于svc配置是后加载，所以要先预判 svc， 让后继续 service 配置，之后再完成 proxies 加载
#   http://exp.com/api/=http://localhost:8080  http:// or https:// 开头的 使用全域名匹配
#   /=relay://vscode  vscode Remote-Server 中继（relay.js 算法）：host 用 /agent?name=&tkn= 注册 NDJSON 控制
#     通道，client 用 /connect?name=&tkn=&skipWebSocketFrames=true 升级后走原始字节，host 用 /session/<id>?tkn= 接走，
#     配对只认 query 里的 tkn（与 host 注册令牌不一致 403）。扩展两侧的 /agent /connect /session/<id> 路径是写死的，
#     必须挂在根路径（放路由表最后，具体路由优先匹配）。该协议没有 cookie 概念，tkn 就是凭证：login_authz 开启时
#     把 /agent|/connect|/session|/status 加进 path_public，或让各方 tkn 等于网关 login token（query_token_key=tkn
#     时同一参数顺带过网关）。/status 可看在线 host 与会话数
#
# 特殊示例
#   /__healthz=text://OK:@now  健康检查，返回 200 OK， 会被替换为当前时间 time.Now().Format(time.RFC3339)
#

# ----------------------------------------------------------------------------
# kvs 的默认启动配置
# ----------------------------------------------------------------------------
[proxies.zcodex]
/__healthz=text://OK:@now
# zcode remote
ws~/remote/ws=relay://zcode-clients
cc~/remote/v4=https://zcode.z.ai/[v=app_version]remote/v4
cc~/api/v1/client=https://zcode.z.ai/[v=app_version]api/v1/client
# zcode local
/assets/,/material-icons/,/pdfjs/,/favicon.ico=file://{KVS_SVC_ZCODE_BIN_HOME}/web/assets
ws~/zcode/remote/ws=relay://zcode
/zcode/api/=-{KVS_SVC_ZCODE_ADDR}/api/
/zcode/ws=-{KVS_SVC_ZCODE_ADDR}/ws
/zcode=svc://zcode
# manager console
/manager=api://manager
# vscode
/__caehe/vscode/nls/=svc://vscode.nls
/stable-<verhash>/web-extension-resource/=svc://vscode.ext
/stable-<verhash>=svc://vscode
/vscode=-svc://vscode
# vscode remote
; cc~/=https://vscode.dev/[v=vscode-version]

# ----------------------------------------------------------------------------
# 服务自动部署 service.def 部署， 启动方式使用 -n :default
# ----------------------------------------------------------------------------

[proxies.default]
/__healthz=text://OK:@now
/=svc://def

[service.def]
# 使用启动用当前服务器，取决于代理是否存在 svc://<name> 这种配置
# service.<name> 这里的 name 即是 def, 也算是一个默认即用的配置
# 以下环境变量，支持在未指定的情况下，重新配置应用级环境变量
# KVS_SVC_<NAME>_HOME: 未指定默认 KVS_HOME/<NAME>
# KVS_SVC_<NAME>_ADDR: 未指定默认 http://127.0.0.1:7501
# KVS_SVC_<NAME>_HOST: 配置无效，取决于 KVS_SVC_<NAME>_ADDR
# KVS_SVC_<NAME>_PORT: 配置无效，取决于 KVS_SVC_<NAME>_ADDR
# KVS_SVC_<NAME>_SOCK: 配置无效，取决于 KVS_SVC_<NAME>_ADDR， unix 协议专用
# KVS_SVC_<NAME>_BIN_HOME: 会根据下载的版本，重建，可以指定，已指定为准
# KVS_SVC_<NAME>_VERSION: 根据 KVS_SVC_DEF_VERSION_LATEST_URL，反推
# KVS_SVC_<NAME>_VERHASH: 未指定，同 KVS_SVC_<NAME>_VERSION

# KVS_SVC_<NAME>_HOME, 默认为 KVS_HOME/<NAME>, /app/.kvs/def
home = {KVS_SVC_DEF_HOME}

# 防止重复启动， 支持 http://和unix://网络请求，判断应用是否存在,
# http(s):// 如果是 #@200 结尾， 要求请求 status 值的 resp.status=200 才算通，否则只要求网络通就行;
# 如果是 unix 协议，有一个特殊的操作， 如果网络不通， 会尝试删除这个 socket 文件， 重新启动后端服务
# http(s) 会尝试解析 生成一个 KVS_SVC_DEF_PORT， KVS_SVC_DEF_HOST 环境变量, 不需要配置， 反推
address = {KVS_SVC_DEF_ADDR:-http://127.0.0.1:7501}

# KVS_SVC_DEF_HEALTHZ=unix://.kvs.sock 环境变量可取代这部分内容
healthz = "{KVS_SVC_DEF_ADDR}/healthz#@200"

# version 必须是版本号 (如 1.133.0)，留空则使用 version_latest_url 地址获取版本
version={KVS_SVC_DEF_VERSION}
# version_latest_url 地址中 #后的值是返回值的取值KEY，KEY对应的值不存在，返回的内容就是版本号
version_latest_url={KVS_SVC_DEF_VERSION_LATEST_URL}
# version 得到值后， 如果 version_hash_url 不存在，KVS_SVC_DEF_VERHASH 等于 KVS_SVC_DEF_VERSION, 如果存在，使用此 url 获取版本的哈希值 (支持 VERSION 替换)
version_hash_url={KVS_SVC_DEF_VERSION_HASH_URL}

# 后端下载地址 (设置后首次请求触发下载→解压→启动)， 优先级最高， 如果没有指定， 使用 download_info + download_field_url 组合的 url 下载
# 地址可能是一个重定向地址，所以下载的时候，需要将重定向后的地址，获取下载文件的 .ext, 用作下载缓存文件名的后缀
download={KVS_SVC_DEF_DOWNLOAD}

# 下载版本信息的接口，返回 json，download_field_url 指定了版本号的字段名， download_field_url 默认值 url， 只有在 download_info 有效时候才生效
# download_info =
# download_field_url = url

# 下载代理 (留空=直连)，支持 http://、https://、socks5:// 协议
# download_proxy = socks5://127.0.0.1:1080

# ----------------------------------------------------------------------------

# 如果这个文件不存在，就是第一次请求，触发下载解压后端服务，等待启动完成后再返回请求
# 在启用的时候， 必须指定这个配置文件地址，部分会导致意外下载的情况发生
bin_home = {KVS_SVC_DEF_BIN_HOME}

# 进程启动的后端命令 (按空白分割，不支持带空格的参数), 支持 KVS_SVC_DEF_HOME 参数
command = {KVS_SVC_DEF_COMMAND}

# 启动前脚本 (每次部署执行一次；file:// 走 shebang；否则 sh -c 执行)
# 一次性脚本：每个部署（KVS_SVC_DEF_BIN_HOME）只执行一次， 通过 {KVS_SVC_DEF_BIN_HOME}/__once__ 标记文件记录（内容为执行时间），
#   标记存在则跳过；想重新执行删除该文件即可
# file:// 开头则执行脚本文件（走 shebang），否则作为 shell 命令 sh -c 执行；留空跳过
once_shell = {KVS_SVC_DEF_ONCE_SHELL}

# 启动脚本：每次 kvs 启动（kvs 管理后端生命周期时）都执行
# file:// 开头则执行脚本文件（走 shebang），否则作为 shell 命令 sh -c 执行；留空跳过
init_shell = {KVS_SVC_DEF_INIT_SHELL}

# 退出前脚本 (每次终止执行一次；file:// 走 shebang；否则 sh -c 执行)， 仅在 kvs 管理后端生命周期时执行 (check 未检测到外部服务时)
# KVS_SVC_STOP_SHELL 环境变量替换该值
stop_shell = {KVS_SVC_DEF_STOP_SHELL}

# 环境变量默认值 (JSON): 环境变量名 -> 默认值。系统环境变量未设置或为空时使用默认值填充
# (已设置则不覆盖)。在 service 段最后处理， 因此默认值可以引用所有已反推的服务变量
# ({KVS_SVC_<NAME>_*})； 填充值进入进程环境， 后端子进程与 once/init/stop 脚本都会继承。
# envs_default = {
#     "DISPLAY": ":1",
#     "ZCODE_DATA_BASE_DIR": "{KVS_SVC_DEF_HOME}"
# }

# ----------------------------------------------------------------------------
# 服务自动部署 service.zcode 部署， 启动方式使用 -n :zcode
# ----------------------------------------------------------------------------

[proxies.zcode]
/__healthz=text://OK:@now
/=svc://zcode

[service.zcode]
# KVS_SVC_ZCODE_HOME: 未指定默认 KVS_HOME/zcode
# KVS_SVC_ZCODE_ADDR: 未指定默认 http://127.0.0.1:7511
# KVS_SVC_ZCODE_HOST: 配置无效，取决于 KVS_SVC_ZCODE_ADDR
# KVS_SVC_ZCODE_PORT: 配置无效，取决于 KVS_SVC_ZCODE_ADDR
# KVS_SVC_ZCODE_BIN_HOME: 会根据下载的版本，重建，可以指定，已指定为准
# KVS_SVC_ZCODE_VERSION: 根据 KVS_SVC_ZCODE_VERSION_LATEST_URL，反推
# KVS_SVC_ZCODE_VERHASH: 未指定，同 KVS_SVC_ZCODE_VERSION
# 
# 没有默认，如果启动代理， 需要而外指定， 如果不启动代理，可以忽略
# KVS_PATH_PUBLIC = /remote/ws|/api/v1/client/configs
# cache_sed 规则（每条一个变量）：old|new|file[,files…][|host[,hosts…]]
# KVS_CC_SED_ZCODE_WS = "`wss://zcode.z.ai/ws`|`wss://>host</remote/ws`|src-*.js|zcode.z.ai"
# KVS_CC_SED_ZCODE_CS = "`/api/v1/client/configs`,ff(e).origin|`/api/v1/client/configs`|src-*.js|zcode.z.ai"
# VS Code web：目录首页(__index)与 workbench 主文件里的 CDN 地址改走本地缓存代理
#   （host 列表=vscode.dev 指被代理的站点；>host< 按请求 Host 展开为浏览器可见地址）
# KVS_CC_SED_VSCODE_MAIN_CDN = "https://main.vscode-cdn.net|https://>host</_cache/https:main.vscode-cdn.net|__index,workbench.web.main.internal.js|vscode.dev"

home = {KVS_SVC_ZCODE_HOME}
address = {KVS_SVC_ZCODE_ADDR:-http://127.0.0.1:7511}
healthz = "{KVS_SVC_ZCODE_ADDR}/api/server-info#@200"

version={KVS_SVC_ZCODE_VERSION}
version_latest_url={KVS_SVC_ZCODE_VERSION_LATEST_URL}
download={KVS_SVC_ZCODE_DOWNLOAD}

bin_home = {KVS_SVC_ZCODE_HOME}/cli/servers/{KVS_SVC_ZCODE_VERSION}
command = {KVS_SVC_NODE} {KVS_SVC_ZCODE_BIN_HOME}/bin/zcode.mjs --web --workspace {KVS_SVC_ZCODE_WSC:-/home} --no-token --no-open --host={KVS_SVC_ZCODE_HOST} --port={KVS_SVC_ZCODE_PORT}

once_shell = {KVS_SVC_ZCODE_ONCE_SHELL}
init_shell = {KVS_SVC_ZCODE_INIT_SHELL}
stop_shell = {KVS_SVC_ZCODE_STOP_SHELL}

# 环境变量默认值： 未设置时填充（原 -c zcodex 预设的代码注入， 现由配置完成）
envs_default = { \
    "ZCODE_DATA_BASE_DIR": "{KVS_SVC_ZCODE_HOME}", \
    "ZCODE_DESKTOP_HOME_DIR": "{KVS_SVC_ZCODE_HOME}", \
    "KVS_PATH_PUBLIC": "/remote/ws|/api/v1/client/configs", \
    "KVS_CC_SED_ZCODE_WS": "`wss://zcode.z.ai/ws`|`wss://>host</remote/ws`|src-*.js|zcode.z.ai", \
    "KVS_CC_SED_ZCODE_CS": "`/api/v1/client/configs`,ff(e).origin|`/api/v1/client/configs`|src-*.js|zcode.z.ai" \
}

# ----------------------------------------------------------------------------
# service.vsc 部署， 启动方式使用 -n :vscode
# ----------------------------------------------------------------------------

[proxies.vscode]
/__healthz=text://OK:@now
/__caehe/vscode/nls/=svc://vscode.nls
/stable-<verhash>/web-extension-resource/=svc://vscode.ext
/=svc://vscode

[service.vscode]
# KVS_SVC_VSCODE_HOME: 未指定默认 KVS_HOME/vscode
# KVS_SVC_VSCODE_ADDR: 未指定默认 http://127.0.0.1:7531
# KVS_SVC_VSCODE_SOCK: 配置无效，取决于 KVS_SVC_VSCODE_ADDR， unix 协议专用
# KVS_SVC_VSCODE_BIN_HOME: 会根据下载的版本，重建，可以指定，已指定为准
# KVS_SVC_VSCODE_VERSION: 根据 KVS_SVC_VSCODE_VERSION_LATEST_URL，反推
# KVS_SVC_VSCODE_VERHASH: 未指定，同 KVS_SVC_VSCODE_VERSION

home = {KVS_SVC_VSCODE_HOME}
address = unix://{KVS_HOME}/vscode.sock
# unix 服务的 healthz 直接写 unix:// socket 路径：探活=拨号 socket（崩溃残留的
# socket 拨号失败会触发 stale 清理与重新拉起；管理页徽章按文件存在判在线）
healthz = "unix://{KVS_HOME}/vscode.sock"

version = {KVS_SVC_VSCODE_VERSION}
version_base_url = {KVS_SVC_VSCODE_DOWNLOAD_BASE:-https://update.code.visualstudio.com}
# https://update.code.visualstudio.com/api/latest/server-linux-x64-web/stable#name
version_latest_url = "{KVS_SVC_VSCODE_DOWNLOAD_BASE}/api/latest/server-linux-x64-web/stable#name"
# https://update.code.visualstudio.com/api/versions/1.133.0/server-linux-x64-web/stable#name
version_hash_url = "{KVS_SVC_VSCODE_DOWNLOAD_BASE}/api/versions/VERSION/server-linux-x64-web/stable#version"
# stable/VERHASH/vscode-server-linux-x64-web.tar.gz|commit:VERHASH/server-linux-x64-web/stable
download = {KVS_SVC_VSCODE_DOWNLOAD_BASE}/{KVS_SVC_VSCODE_DOWNLOAD_PATH:-commit:VERHASH/server-linux-x64-web/stable}

# 下载版本信息的接口，返回 json，download_field_url 指定了版本号的字段名， download_field_url 默认值 url， 只有在 download_info 有效时候才生效
# https://update.code.visualstudio.com/api/versions/1.132.0/server-linux-x64-web/stable
# download_info = "{KVS_SVC_VSCODE_DOWNLOAD_BASE}/api/versions/VERHASH/server-linux-x64-web/stable"
# download_field_url = url

# 下载代理 (留空=直连)，支持 http://、https://、socks5:// 协议
# download_proxy = socks5://127.0.0.1:1080

# 如果这个文件不存在，就是第一次请求，触发下载解压后端服务，等待启动完成后再返回请求
bin_home = {KVS_SVC_VSCODE_HOME}/cli/servers/Stable-{KVS_SVC_VSCODE_VERHASH}/server

# 进程启动的后端命令 (按空白分割，不支持带空格的参数)
command = {KVS_SVC_VSCODE_BIN_HOME}/bin/code-server --accept-server-license-terms --without-connection-token \
    --server-data-dir {KVS_SVC_VSCODE_HOME}/ --socket-path {KVS_SVC_VSCODE_SOCK} --start-server \
    {KVS_SVC_VSCODE_EXTARGS}

# 启动前脚本 (每次部署执行一次；file:// 走 shebang；否则 sh -c 执行)
# NLS 挂载由路由表达：/__caehe/vscode/nls/=svc://vscode.nls（svc 服务扩展）。
# KVS_SVC_VSCODE_NLS_URL 仅供 once_shell 替换 workbench 里的 NLS 地址，需与路由挂载一致
# KVS_SVC_VSCODE_LP_URL 必须是 https://xxx/_cache/cc~www.vscode-unpkg.net/_lp/ 或 /stable/web-extension-resource/www.vscode-unpkg.net/_lp/
# 一次性脚本：每个部署（KVS_SVC_VSCODE_BIN_HOME）只执行一次， 通过 {KVS_SVC_VSCODE_BIN_HOME}/__once__ 标记文件记录（内容为执行时间），
#   标记存在则跳过；想重新执行删除该文件即可
# file:// 开头则执行脚本文件（走 shebang），否则作为 shell 命令 sh -c 执行；留空跳过
once_shell = sed -i \
    -e "s|https://www.vscode-unpkg.net/nls/|{KVS_SVC_VSCODE_NLS_URL:-/__caehe/vscode/nls/}|g" \
    -e "s|https://www.vscode-unpkg.net/_lp/|{KVS_SVC_VSCODE_LP_URL}|g" \
    -e "s|https://main.vscode-cdn.net/extensions/marketplace.json||g" \
    -e "s|https://main.vscode-cdn.net/mcp/servers.json||g" \
    -e "s|https://main.vscode-cdn.net/extensions/chat.json||g" \
    -e 's|"webUrl": "https://vscode.dev",|"webUrl": "",|' \
    {KVS_SVC_VSCODE_BIN_HOME}/product.json

# 启动脚本：每次 kvs 启动（kvs 管理后端生命周期时）都执行
# file:// 开头则执行脚本文件（走 shebang），否则作为 shell 命令 sh -c 执行；留空跳过
init_shell = echo '{ "commit": "{KVS_SVC_VSCODE_VERHASH}", "version": "{KVS_SVC_VSCODE_VERSION}", "bin_home": "{KVS_SVC_VSCODE_BIN_HOME}", "svc_home": "{KVS_SVC_VSCODE_HOME}" }' \
    > {KVS_SVC_VSCODE_SOCK}.json

# 退出前脚本 (每次终止执行一次；file:// 走 shebang；否则 sh -c 执行)， 仅在 kvs 管理后端生命周期时执行 (check 未检测到外部服务时)
stop_shell = rm {KVS_SVC_VSCODE_SOCK} {KVS_SVC_VSCODE_SOCK}.json

# https://github.com/microsoft/vscode-loc/tree/main/i18n
# 仅保留 key 与 value 不对称的语言 (其余语言 value 默认等于 key)
vsc_language = {"zh-cn":"zh-hans", "zh-tw":"zh-hant"}

# 启动 agents 命令，/usr/share/code/code 是默认， 可以自定义为 ./code-cli
vsc_agents_cmd = {KVS_SVC_VSCODE_AGENTS_CMD}
# 命令预设表 (JSON): name -> command，命令内支持 {KVS_SVC_VSCODE_HOME} {KVS_SVC_VSCODE_BIN_HOME} 占位符展开
# /__agents/status 会返回 cmds，前端 Agents 编辑命令时候，如果没有任何内容，会出现在输入框中的快捷按钮
vsc_agent_cmds = { \
    "vscode": "DISPLAY=:1 /usr/share/code/code --no-sandbox --user-data-dir {KVS_SVC_VSCODE_HOME}/data --extensions-dir {KVS_SVC_VSCODE_HOME}/extensions", \
    "agentv": "{KVS_SVC_VSCODE_BIN_HOME}/node xxx start -- --user-data-dir {KVS_SVC_VSCODE_HOME}/data" \
}
# --agent-host-bridge-path ${json.endpoint.path} --agent-host-bridge-connection-token ${json.endpoint.connectionToken}
# --agent-host-bridge-port ${json.endpoint.port} --agent-host-bridge-connection-token ${json.endpoint.connectionToken} --agent-host-bridge-port 127.0.0.1
# 列举 vsc_agents_dir 指定的文件内容， 具有 json.endpoint 文件的内容都要读取， 然后给一个列表，包括 json.endpoint.path or port(补充 ws://127.0.0.1:{port})内容
vsc_agents_dir = {KVS_SVC_VSCODE_HOME}/data/agent-host/local-endpoint/entries/
# 上面的命令， 增加到 command 中， 默认最好为空，使用自动自动挂着
vsc_agent_args = {KVS_SVC_VSCODE_AGENT_ARGS}

# 使用 vscode 打开方式， 也可以修改为 code-oss://suisrc.remote-server/open
vsc_open_url = {KVS_SVC_VSCODE_OPEN_URL:-vscode://ms-vscode.remote-server/open}

# ----------------------------------------------------------------------------
# 通用 action 指令表： key = 指令名， value = 要执行的命令
# kvs 不关心命令内容，只负责调用： 访问 /__agents/action/<key> 即执行对应命令
# 支持 file:// 前缀 (直接执行脚本，走 shebang)， 否则用 sh -c 执行
# 目前 logout.vsc.js 中定义了 Patch -> patch_cmd, Revert -> patch_rev
# 执行补丁 vscode agent 强制登录补丁， 在不登录的情况下使用 agent host 三件套， copilot, claude, codex
actions = { \
    "patch_cmd": "SERVER_DIR={KVS_SVC_VSCODE_BIN_HOME} patch-vscode", \
    "patch_rev": "SERVER_DIR={KVS_SVC_VSCODE_BIN_HOME} patch-vscode --revert" \
}

# ----------------------------------------------------------------------------
# 环境变量默认值： 未设置时填充（原 -c zcodex 预设的代码注入， 现由配置完成）
# "KVS_CC_REC_VSCODE_ANYCODE": "ms-vscode.vscode-unpkg.net|/anycode,package.nls.json|204||text/plain; charset=utf-8"
# "KVS_CC_SED_VSCODE_VSU_PKG_CDN": "{{uuid}}.vscode-cdn.net|>host</__cache/cc~https:{{uuid}}.vscode-cdn.net|__index,workbench.web.main.internal.js|vscode.dev,main.vscode-cdn.net"
# "KVS_CC_SED_VSCODE_VSR_PKG_CDN": "{publisher}.vscode-unpkg.net|>host</__cache/cc~https:{publisher}.vscode-unpkg.net|__index,workbench.web.main.internal.js|vscode.dev,main.vscode-cdn.net"
# envs_default = { \
#     "KVS_CC_REC_VSCODE_ANYCODE": "ms-vscode.vscode-unpkg.net|/anycode,package.nls.json|200|{}|application/json", \
#     "KVS_CC_SED_VSCODE_EQUIV": "<meta http-equiv=|<meta name=|__index|vscode.dev", \
#     "KVS_CC_SED_VSCODE_MAIN_CDN": "main.vscode-cdn.net|>host</__cache/cc~https:main.vscode-cdn.net|__index,workbench.web.main.internal.js,sw.js|vscode.dev,main.vscode-cdn.net", \
#     "KVS_CC_SED_VSCODE_WWW_PKG_CDN": "www.vscode-unpkg.net|>host</__cache/cc~https:www.vscode-unpkg.net|__index,workbench.web.main.internal.js|vscode.dev,main.vscode-cdn.net", \
#     "KVS_CC_SED_VSCODE_MSV_PKG_CDN": "ms-vscode.vscode-unpkg.net|>host</__cache/cc~https:ms-vscode.vscode-unpkg.net|__index,workbench.web.main.internal.js|vscode.dev,main.vscode-cdn.net" \
# }

# ----------------------------------------------------------------------------
# 将应用镜像同步s3服务器上， 这个是为 vscode 定制的功能
# 支持命令：
# export KVS_MIRROR_S3_PREFIX=
# export KVS_MIRROR_S3_ACCESS=
# export KVS_MIRROR_S3_SECRET=
# export KVS_MIRROR_S3_REGION=
# latest 版本同步, vscode: 内置默认配置（官方 update API）, 存储配置使用 KVS_MIRROR_S3_* 环境变量
# kvs mirror vscode -platform server-linux-x64-web(默认) -version latest(默认)
# 例子
# kvs mirror vscode # 同步最终版本到 S3 镜像服务器上
# kvs mirror vscode -platform server-linux-x64 -version 1.139.1 # 同步 1.139.1 版本到 S3 镜像服务器上
# 

# ----------------------------------------------------------------------------
# 服务自动部署 service.dsh 部署， 启动方式使用 -n :dshweb (deepseek harness) 暂时不开发对应
# ----------------------------------------------------------------------------

[proxies.dshweb]
/__healthz=text://OK:@now
/=svc://dshweb

[service.dshweb]
# KVS_SVC_DSHWEB_HOME: 未指定默认 KVS_HOME/dshweb
# KVS_SVC_DSHWEB_ADDR: 未指定默认 http://127.0.0.1:7531
# KVS_SVC_DSHWEB_HOST: 配置无效，取决于 KVS_SVC_DSHWEB_ADDR
# KVS_SVC_DSHWEB_PORT: 配置无效，取决于 KVS_SVC_DSHWEB_ADDR
# KVS_SVC_DSHWEB_BIN_HOME: 会根据下载的版本，重建，可以指定，已指定为准
# KVS_SVC_DSHWEB_VERSION: 根据 KVS_SVC_DSHWEB_VERSION_LATEST_URL，反推
# KVS_SVC_DSHWEB_VERHASH: 未指定，同 KVS_SVC_DSHWEB_VERSION

home = {KVS_SVC_DSHWEB_HOME}
address = {KVS_SVC_DSHWEB_ADDR:-http://127.0.0.1:7531}
healthz = "{KVS_SVC_DSHWEB_ADDR}/#@200"

version={KVS_SVC_DSHWEB_VERSION}
version_latest_url={KVS_SVC_DSHWEB_VERSION_LATEST_URL}
download={KVS_SVC_DSHWEB_DOWNLOAD}

bin_home = {KVS_SVC_DSHWEB_BIN_HOME}
command = dsh web --port {KVS_SVC_DSHWEB_PORT}

once_shell = {KVS_SVC_DSHWEB_ONCE_SHELL}
init_shell = {KVS_SVC_DSHWEB_INIT_SHELL}
stop_shell = {KVS_SVC_DSHWEB_STOP_SHELL}
